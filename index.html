      lst.append(i)\n    return lst\n@measure_performance\ndef test_tuple_creation(n):\n    return tuple(range(n))\n@measure_performance\ndef test_shallow_copy(obj):\n    return obj.copy()\n@measure_performance\ndef test_deep_copy(obj):\n    import copy\n    return copy.deepcopy(obj)\n# 性能对比测试\ndef performance_comparison():\n    sizes = [100, 1000, 10000]\n    results = []\n    for size in sizes:\n        # 列表 vs 元组\n        list_result, list_time = test_list_operations(size)\n        tuple_result, tuple_time = test_tuple_creation(size)\n        # 浅拷贝 vs 深拷贝\n        nested_list = [[i] for i in range(size)]\n        _, shallow_time = test_shallow_copy(nested_list)\n        _, deep_time = test_deep_copy(nested_list)\n        results.append({\n            'size': size,\n            'list_time': list_time,\n            'tuple_time': tuple_time,\n            'shallow_copy_time': shallow_time,\n            'deep_copy_time': deep_time,\n            'list_memory': sys.getsizeof(list_result),\n            'tuple_memory': sys.getsizeof(tuple_result)\n        })\n    return pd.DataFrame(results)\n# 生成分析报告\ndef generate_report():\n    print(\"=== 数据容器分析报告 ===\\n\")\n    # 分析不同对象\n    test_objects = {\n        '列表': [1, 2, 3, [4, 5]],\n    '元组': (1, 2, 3, (4, 5)),\n    '字典': {'a': [1, 2], 'b': 3},\n    '集合': {1, 2, 3}\n}\nprint(\"1. 对象可变性分析:\")\nfor name, obj in test_objects.items():\n    info = analyze_mutability(obj)\n    print(f\"\\n{name}:\")\n    for key, value in info.items():\n        print(f\"\n                {key}: {value}\")\n# 查找可变元素\nprint(\"\\n\\n2. 可变元素检测:\")\ncontainer = [1, \"hello\", [2, 3], {'a': 1}, (4, 5)]\nmutable = find_mutable_elements(container)\nfor idx, type_name, item in mutable:\n    print(f\"  索引{idx}: {type_name} - {item}\")\n# 性能对比\nprint(\"\\n\\n3. 性能对比:\")\ndf = performance_comparison()\nprint(df.to_string(index=False))\n# 保存报告\ndf.to_excel('container_analysis_report.xlsx', index=False)\nprint(\"\\n报告已保存到 container_analysis_report.xlsx\")\n# 可视化\nfig, axes = plt.subplots(1, 2, figsize=(12, 5))\n# 时间对比\ndf.plot(x='size', y=['list_time', 'tuple_time'], ax=axes[0], marker='o')\naxes[0].set_title('列表 vs 元组创建时间')\naxes[0].set_xlabel('元素数量')\naxes[0].set_ylabel('时间(秒)')\n# 拷贝时间对比\ndf.plot(x='size', y=['shallow_copy_time', 'deep_copy_time'], ax=axes[1], marker='o')\naxes[1].set_title('浅拷贝 vs 深拷贝时间')\naxes[1].set_xlabel('元素数量')\naxes[1].set_ylabel('时间(秒)')\nplt.tight_layout()\nplt.savefig('performance_comparison.png')\nprint(\"性能对比图已保存到 performance_comparison.png\")\n# 运行分析\ngenerate_report()\n题目4和5的参考答案\n    的参考答案由于篇幅限制，核心思路：",

    "number": 1,
    "stem": "实现一个不可变列表类 ImmutableList ：\n1. 基本功能\n    基本功能：\n• 支持索引访问\n• 支持切片\n• 支持迭代\n• 支持len()\n2. 不可变性保证\n不可变性保证：\n• 任何修改操作返回新对象\n• 原对象保持不变\n• 实现 append() 、 extend() 等方法（返回新对象）\n3. 性能优化\n性能优化：\n• 使用元组内部存储\n• 实现结构共享（避免完全复制）\n• 提供 to_list() 转换方法\n4. 额外功能\n额外功能：\n• 实现 __hash__() 使其可作为字典键\n• 实现 __add__() 支持+操作\n• 提供 map() 、 filter() 等函数式方法",
    "title": "不可变数据结构实现",
    "answer": "class ImmutableList:\n    \"\"\"\n    不可变列表实现\n    设计思路：\n    1. 内部使用元组存储数据，保证不可变性\n    2. 所有修改操作返回新的ImmutableList对象\n    3. 实现__hash__使其可作为字典键\n    4. 提供函数式编程接口\n    \"\"\"\n    def __init__(self, items=()):\n        # 使用元组作为内部存储，确保不可变性\n        if isinstance(items, tuple):\n            self._data = items\n        else:\n            self._data = tuple(items)\n    # === 基本访问方法 ===\n    def __getitem__(self, index):\n        \"\"\"支持索引和切片访问\"\"\"\n        if isinstance(index, slice):\n            return ImmutableList(self._data[index])\n        return self._data[index]\n    def __len__(self):\n        \"\"\"返回长度\"\"\"\n        return len(self._data)\n    def __iter__(self):\n        \"\"\"支持迭代\"\"\"\n        return iter(self._data)\n    def __repr__(self):\n        \"\"\"字符串表示\"\"\"\n        return f\"ImmutableList({list(self._data)})\"\n    # === 不可变性保证 ===\n    def __hash__(self):\n    \"\"\"实现哈希，使其可作为字典键\"\"\"\n    return hash(self._data)\ndef __eq__(self, other):\n    \"\"\"相等性比较\"\"\"\n    if isinstance(other, ImmutableList):\n        return self._data == other._data\n    return False\n# === 修改操作（返回新对象）===\ndef append(self, item):\n    \"\"\"添加元素，返回新对象\"\"\"\n    return ImmutableList(self._data + (item,))\ndef extend(self, items):\n    \"\"\"扩展列表，返回新对象\"\"\"\n    return ImmutableList(self._data + tuple(items))\ndef insert(self, index, item):\n    \"\"\"插入元素，返回新对象\"\"\"\n    return ImmutableList(self._data[:index] + (item,) + self._data[index:])\ndef remove(self, item):\n    \"\"\"移除元素，返回新对象\"\"\"\n    data_list = list(self._data)\n    data_list.remove(item)\n    return ImmutableList(data_list)\ndef pop(self, index=-1):\n    \"\"\"弹出元素，返回(新列表, 弹出的元素)\"\"\"\n    data_list = list(self._data)\n    popped = data_list.pop(index)\n    return ImmutableList(data_list), popped\n# === 运算符重载 ===\ndef __add__(self, other):\n    \"\"\"支持+操作\"\"\"\n    if isinstance(other, ImmutableList):\n        return ImmutableList(self._data + other._data)\n    return ImmutableList(self._data + tuple(other))\n    def __mul__(self, n):\n        \"\"\"支持*操作\"\"\"\n        return ImmutableList(self._data * n)\n    # === 函数式方法 ===\n    def map(self, func):\n        \"\"\"映射操作\"\"\"\n        return ImmutableList(func(item) for item in self._data)\n    def filter(self, predicate):\n        \"\"\"过滤操作\"\"\"\n        return ImmutableList(item for item in self._data if predicate(item))\n    def reduce(self, func, initial=None):\n        \"\"\"归约操作\"\"\"\n        from functools import reduce as functools_reduce\n        if initial is None:\n            return functools_reduce(func, self._data)\n        return functools_reduce(func, self._data, initial)\n    # === 转换方法 ===\n    def to_list(self):\n        \"\"\"转换为普通列表\"\"\"\n        return list(self._data)\n    def to_tuple(self):\n        \"\"\"转换为元组\"\"\"\n        return self._data\n# === 使用示例 ===\nprint(\"=== ImmutableList 示例 ===\\n\")\n# 创建不可变列表\nlst = ImmutableList([1, 2, 3])\nprint(f\"原列表: {lst}\")\n# 添加元素（返回新对象）\nlst2 = lst.append(4)\nprint(f\"添加后: {lst2}\")\nprint(f\"原列表不变: {lst}\")\n# 扩展列表\nlst3 = lst2.extend([5, 6])\nprint(f\"扩展后: {lst3}\")\n# 函数式操作\ndoubled = lst.map(lambda x: x * 2)\nprint(f\"\\nMap操作: {doubled}\")\nevens = lst3.filter(lambda x: x % 2 == 0)\nprint(f\"Filter操作: {evens}\")\ntotal = lst3.reduce(lambda a, b: a + b)\nprint(f\"Reduce操作: {total}\")\n# 作为字典键\nd = {lst: \"value1\", lst2: \"value2\"}\nprint(f\"\\n作为字典键: {d}\")\n# 链式操作\nresult = (ImmutableList([1, 2, 3])\n    .append(4)\n    .extend([5, 6])\n    .map(lambda x: x ** 2)\n    .filter(lambda x: x > 10))\nprint(f\"链式操作结果: {result}\")",

    "stem": "实现参数验证和保护装饰器：\n1. @validate_types：\n• 验证参数类型\n• 支持类型注解\n• 类型不匹配时抛出异常\n2. @protect_mutable：\n• 自动复制可变参数\n• 防止函数修改外部对象\n• 可配置深拷贝或浅拷贝\n3. @freeze_return：\n• 将返回的可变对象转为不可变\n• 列表转元组\n• 字典转frozendict\n4. 综合示例\n综合示例：\n• 组合使用多个装饰器\n• 处理复杂嵌套结构\n• 提供详细的错误信息",
    "title": "参数验证装饰器",
    "answer": "import copy\nfrom functools import wraps\nimport inspect\nfrom typing import get_type_hints\ndef validate_types(func):\n    \"\"\"\n    验证参数类型装饰器\n    功能说明：\n    1. 基于函数的类型注解验证参数类型\n    2. 类型不匹配时抛出TypeError\n    3. 保留原函数的元数据\n    \"\"\"\n    @wraps(func)\n    def wrapper(*args, **kwargs):\n        # 获取函数签名和类型注解\n        sig = inspect.signature(func)\n        bound = sig.bind(*args, **kwargs)\n        bound.apply_defaults()\n        # 获取类型提示\n        hints = get_type_hints(func)\n        # 验证每个参数\n        for param_name, param_value in bound.arguments.items():\n            if param_name in hints:\n                expected_type = hints[param_name]\n                if not isinstance(param_value, expected_type):\n                raise TypeError(\n                f\"参数 '{param_name}' 期望类型{expected_type.__name__}, \"\n                f\"但得到{type(param_value).__name__}\"\n                )\n        return func(*args, **kwargs)\n    return wrapper\ndef protect_mutable(deep=False):\n    \"\"\"\n    保护可变参数装饰器\n    参数说明：\n    - deep: True使用深拷贝，False使用浅拷贝\n    功能说明：\n    1. 自动复制可变参数\n    2. 防止函数修改外部对象\n    3. 可配置拷贝深度\n    \"\"\"\n    def decorator(func):\n        @wraps(func)\n        def wrapper(*args, **kwargs):\n            # 复制可变参数\n            new_args = []\n            for arg in args:\n                if isinstance(arg, (list, dict, set)):\n                if deep:\n                new_args.append(copy.deepcopy(arg))\n                else:\n                new_args.append(copy.copy(arg))\n                else:\n                new_args.append(arg)\n            new_kwargs = {}\n            for key, value in kwargs.items():\n                if isinstance(value, (list, dict, set)):\n                if deep:\n                new_kwargs[key] = copy.deepcopy(value)\n                else:\n                new_kwargs[key] = copy.copy(value)\n                else:\n                new_kwargs[key] = value\n            return func(*new_args, **new_kwargs)\n        return wrapper\n    return decorator\ndef freeze_return(func):\n    \"\"\"\n    冻结返回值装饰器\n    功能说明：\n    1. 将返回的可变对象转为不可变\n    2. list → tuple\n    3. dict → frozendict (使用元组模拟)\n    4. set → frozenset\n    \"\"\"\n    @wraps(func)\n    def wrapper(*args, **kwargs):\n        result = func(*args, **kwargs)\n        return _make_immutable(result)\n    return wrapper\ndef _make_immutable(obj):\n    \"\"\"递归将对象转为不可变\"\"\"\n    if isinstance(obj, list):\n        return tuple(_make_immutable(item) for item in obj)\n    elif isinstance(obj, dict):\n        # 使用元组模拟frozendict\n        return tuple((k, _make_immutable(v)) for k, v in sorted(obj.items()))\n    elif isinstance(obj, set):\n        return frozenset(_make_immutable(item) for item in obj)\n    else:\n        return obj\n# === 使用示例 ===\nprint(\"=== 参数验证装饰器示例 ===\\n\")\n# 示例1：类型验证\n@validate_types\ndef greet(name: str, age: int) -> str:\n    return f\"Hello {name}, you are {age} years old\"\ntry:\n    print(greet(\"Alice\", 25))\n    print(greet(\"Bob\", \"30\"))\n# 类型错误\nexcept TypeError as e:\n    print(f\"类型错误: {e}\")\n# 示例2：保护可变参数\n@protect_mutable(deep=True)\ndef modify_list(lst):\n    \"\"\"这个函数修改列表，但不会影响外部\"\"\"\n    lst.append(999)\n    return lst\noriginal = [1, 2, 3]\nresult = modify_list(original)\nprint(f\"\\n原列表: {original}\")\n# [1, 2, 3]\nprint(f\"返回值: {result}\")\n# [1, 2, 3, 999]\n# 示例3：冻结返回值\n@freeze_return\ndef create_config():\n    \"\"\"返回配置字典，但会被冻结\"\"\"\n    return {\n        'name': 'app',\n        'settings': {'debug': True, 'port': 8000},\n        'features': ['auth', 'api']\n    }\nconfig = create_config()\nprint(f\"\\n冻结的配置: {config}\")\nprint(f\"类型: {type(config)}\")\n# 示例4：组合使用装饰器\n@freeze_return\n@protect_mutable()\n@validate_types\ndef process_data(data: list, multiplier: int) -> list:\n    \"\"\"处理数据：验证类型、保护参数、冻结返回值\"\"\"\n    return [x * multiplier for x in data]\ndata = [1, 2, 3]\nresult = process_data(data, 2)\nprint(f\"\\n原数据: {data}\")\nprint(f\"处理结果: {result}\")\nprint(f\"结果类型: {type(result)}\")",

    "answer": "from collections import OrderedDict\nimport time\nimport hashlib\nimport pickle\nclass CacheKey:\n    \"\"\"\n    将可变对象转为可哈希的缓存键\n    设计思路：\n    1. 将任意对象序列化为字符串\n    2. 计算哈希值作为缓存键\n    3. 处理嵌套结构和循环引用\n    \"\"\"\n    @staticmethod\n    def make_key(*args, **kwargs):\n        \"\"\"创建缓存键\"\"\"\n        try:\n            # 尝试直接哈希\n            key_data = (args, tuple(sorted(kwargs.items())))\n            return hash(key_data)\n        except TypeError:\n            # 对于不可哈希的对象，使用pickle序列化\n            serialized = pickle.dumps((args, kwargs))\n            return hashlib.md5(serialized).hexdigest()\nclass SmartCache:\n    \"\"\"\n    智能缓存系统\n    功能特性：\n    1. 自动处理可变参数\n    2. 支持TTL过期\n    3. LRU淘汰策略\n    4. 缓存统计\n    \"\"\"\ndef __init__(self, maxsize=128, ttl=None):\n    \"\"\"\n    参数说明：\n    - maxsize: 最大缓存条目数\n    - ttl: 过期时间（秒），None表示不过期\n    \"\"\"\n    self.maxsize = maxsize\n    self.ttl = ttl\n    self.cache = OrderedDict()\n    self.timestamps = {}\n    self.hits = 0\n    self.misses = 0\ndef get(self, *args, **kwargs):\n    \"\"\"获取缓存值\"\"\"\n    key = CacheKey.make_key(*args, **kwargs)\n    # 检查是否存在\n    if key not in self.cache:\n        self.misses += 1\n        return None\n    # 检查是否过期\n    if self.ttl is not None:\n        if time.time() - self.timestamps[key] > self.ttl:\n            del self.cache[key]\n            del self.timestamps[key]\n            self.misses += 1\n            return None\n    # 命中：移到末尾（LRU）\n    self.cache.move_to_end(key)\n    self.hits += 1\n    return self.cache[key]\ndef put(self, value, *args, **kwargs):\n    \"\"\"存入缓存\"\"\"\n    key = CacheKey.make_key(*args, **kwargs)\n        # 如果已存在，更新并移到末尾\n        if key in self.cache:\n            self.cache.move_to_end(key)\n        self.cache[key] = value\n        self.timestamps[key] = time.time()\n        # 检查大小限制\n        if len(self.cache) > self.maxsize:\n            # 删除最旧的条目\n            oldest_key = next(iter(self.cache))\n            del self.cache[oldest_key]\n            del self.timestamps[oldest_key]\n    def clear(self):\n        \"\"\"清空缓存\"\"\"\n        self.cache.clear()\n        self.timestamps.clear()\n        self.hits = 0\n        self.misses = 0\n    def stats(self):\n        \"\"\"获取统计信息\"\"\"\n        total = self.hits + self.misses\n        hit_rate = self.hits / total if total > 0 else 0\n        return {\n            'hits': self.hits,\n            'misses': self.misses,\n            'hit_rate': hit_rate,\n            'size': len(self.cache),\n            'maxsize': self.maxsize\n        }\ndef cached(cache_instance):\n    \"\"\"\n    缓存装饰器\n    使用方法：\n    @cached(my_cache)\n    def expensive_function(x, y):\n        ...\n    \"\"\"\n    def decorator(func):\n        @wraps(func)\n        def wrapper(*args, **kwargs):\n            # 尝试从缓存获取\n            cached_value = cache_instance.get(*args, **kwargs)\n            if cached_value is not None:\n                return cached_value\n            # 计算结果\n            result = func(*args, **kwargs)\n            # 存入缓存\n            cache_instance.put(result, *args, **kwargs)\n            return result\n        wrapper.cache = cache_instance\n        return wrapper\n    return decorator\n# === 使用示例 ===\nprint(\"=== 智能缓存系统示例 ===\\n\")\n# 创建缓存实例\ncache = SmartCache(maxsize=100, ttl=5)\n# 示例1：处理可变参数\n@cached(cache)\ndef process_list(data, multiplier):\n    \"\"\"耗时操作\"\"\"\n    print(f\"  计算: {data} * {multiplier}\")\n    time.sleep(0.1)\n    return [x * multiplier for x in data]\nprint(\"第1次调用（未命中）:\")\nresult1 = process_list([1, 2, 3], 2)\nprint(f\"结果: {result1}\")\nprint(\"\\n第2次调用（命中）:\")\nresult2 = process_list([1, 2, 3], 2)\nprint(f\"结果: {result2}\")\nprint(\"\\n第3次调用（不同参数，未命中）:\")\nresult3 = process_list([1, 2, 3], 3)\nprint(f\"结果: {result3}\")\n# 统计信息\nprint(f\"\\n缓存统计: {cache.stats()}\")\n# 示例2：TTL过期测试\nprint(\"\\n=== TTL过期测试 ===\")\ncache_ttl = SmartCache(maxsize=10, ttl=2)\n@cached(cache_ttl)\ndef slow_function(x):\n    print(f\"  计算{x}\")\n    return x ** 2\nprint(\"首次调用:\")\nprint(slow_function(5))\nprint(\"\\n立即再次调用（缓存命中）:\")\nprint(slow_function(5))\nprint(\"\\n等待3秒后调用（缓存过期）:\")\ntime.sleep(3)\nprint(slow_function(5))\nprint(f\"\\n统计: {cache_ttl.stats()}\")\n评分说明：\n• 单选题：每题1分，共30分\n• 多选题：每题2分，选对但不全得1分，有错选不得分，共30分\n• 填空题：每空1分，共10分\n• 代码阅读题：每题3分，共15分\n• 程序设计题：5选3，每题5分，共15分\n• 总分：\n总分：100分",

, 3}\ns.discard(5)\n# 不报错，s不变\n使用建议：\n• 确定元素存在时用 remove()\n• 不确定元素是否存在时用 discard()\n其他删除方法：\ns.pop()\n# 删除并返回任意元素\ns.clear()\n# 清空集合\n对比总结：\ns = {1, 2, 3}\n# remove: 严格模式\ntry:\n    s.remove(5)\nexcept KeyError:\n    print(\"元素不存在\")\n# discard: 宽松模式\ns.discard(5)\n# 静默忽略"

    "stem": "实现一个工具来追踪对象的可变性变化：\n1. MutabilityTracker类：\n    • 包装任何对象\n    • 记录所有修改操作\n    • 提供修改历史查询\n2. 功能要求\n功能要求：\n• 拦截所有修改方法\n• 记录修改前后的状态\n• 支持撤销操作\n• 导出修改日志\n3. 支持的类型\n支持的类型：\n• 列表\n• 字典\n• 集合\n• 自定义对象",
    "title": "可变性追踪器",
    "answer": "import copy\nfrom functools import wraps\nfrom datetime import datetime\nclass MutabilityTracker:\n    \"\"\"\n    可变性追踪器 - 追踪对象的所有修改操作\n    功能特性：\n    1. 记录所有修改操作\n    2. 保存修改前后的状态\n    3. 支持撤销操作\n    4. 导出修改日志\n    使用示例：\n    tracker = MutabilityTracker([1, 2, 3])\n    tracker.append(4)\n    tracker.undo()\n    \"\"\"\n    def __init__(self, obj):\n        \"\"\"\n        初始化追踪器\n        参数：\n        - obj: 要追踪的对象（列表、字典或集合）\n        \"\"\"\n        self._obj = obj\n        self._history = []\n        self._operation_log = []\n        # 保存初始状态\n        self._save_state(\"初始化\", copy.deepcopy(obj))\n    def _save_state(self, operation, state_before=None):\n        \"\"\"保存操作前的状态\"\"\"\n        timestamp = datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        if state_before is None:\n            state_before = copy.deepcopy(self._obj)\n    self._history.append({\n        'timestamp': timestamp,\n        'operation': operation,\n        'state_before': state_before,\n        'state_after': copy.deepcopy(self._obj)\n    })\n    self._operation_log.append(f\"[{timestamp}] {operation}\")\ndef __getattr__(self, name):\n    \"\"\"拦截所有方法调用\"\"\"\n    attr = getattr(self._obj, name)\n    # 如果是修改方法，包装它\n    if callable(attr) and self._is_mutating_method(name):\n        @wraps(attr)\n        def wrapper(*args, **kwargs):\n            # 保存操作前状态\n            state_before = copy.deepcopy(self._obj)\n            # 执行操作\n            result = attr(*args, **kwargs)\n            # 记录操作\n            args_str = ', '.join(repr(a) for a in args)\n            self._save_state(f\"{name}({args_str})\", state_before)\n            return result\n        return wrapper\n    return attr\ndef _is_mutating_method(self, method_name):\n    \"\"\"判断是否是修改方法\"\"\"\n    mutating_methods = {\n        # 列表方法\n        'append', 'extend', 'insert', 'remove', 'pop',\n        'clear', 'sort', 'reverse',\n        # 字典方法\n        'update', 'setdefault', 'popitem',\n        # 集合方法\n        'add', 'discard', 'update', 'intersection_update',\n        'difference_update', 'symmetric_difference_update'\n    }\n    return method_name in mutating_methods\ndef undo(self):\n    \"\"\"撤销最后一次操作\"\"\"\n    if len(self._history) <= 1:\n        print(\"没有可撤销的操作\")\n        return\n    # 获取上一个状态\n    self._history.pop()\n    # 移除当前状态\n    previous_state = self._history[-1]['state_after']\n    # 恢复状态\n    if isinstance(self._obj, list):\n        self._obj.clear()\n        self._obj.extend(previous_state)\n    elif isinstance(self._obj, dict):\n        self._obj.clear()\n        self._obj.update(previous_state)\n    elif isinstance(self._obj, set):\n        self._obj.clear()\n        self._obj.update(previous_state)\n    print(f\"已撤销到：{previous_state}\")\ndef get_history(self):\n    \"\"\"获取修改历史\"\"\"\n    return self._history.copy()\ndef export_log(self, filename=None):\n    \"\"\"导出修改日志\"\"\"\n    log = \"\\n\".join(self._operation_log)\n    if filename:\n        with open(filename, 'w', encoding='utf-8') as f:\n            f.write(log)\n            print(f\"日志已导出到{filename}\")\n        else:\n            print(\"=== 修改日志 ===\")\n            print(log)\n        return log\n    def get_obj(self):\n        \"\"\"获取被追踪的对象\"\"\"\n        return self._obj\n    def __repr__(self):\n        return f\"MutabilityTracker({self._obj})\"\n# === 使用示例 === {#-使用示例- }\nprint(\"=== 可变性追踪器示例 ===\\n\")\n# 示例1：追踪列表 {#示例1追踪列表 }\nprint(\"示例1：追踪列表操作\")\ntracker = MutabilityTracker([1, 2, 3])\nprint(f\"初始状态: {tracker.get_obj()}\")\ntracker.append(4)\nprint(f\"添加后: {tracker.get_obj()}\")\ntracker.extend([5, 6])\nprint(f\"扩展后: {tracker.get_obj()}\")\ntracker.remove(2)\nprint(f\"删除后: {tracker.get_obj()}\")\n# 查看历史 {#查看历史 }\nprint(\"\\n修改历史:\")\nfor record in tracker.get_history()[-3:]:\n    print(f\"\n            {record['operation']}: {record['state_before']} -> {record['state_after']}\")\n# 撤销操作 {#撤销操作 }\nprint(\"\\n撤销最后一次操作:\")\ntracker.undo()\nprint(f\"当前状态: {tracker.get_obj()}\")\n# 导出日志 {#导出日志 }\nprint()\ntracker.export_log()\n# 示例2：追踪字典 {#示例2追踪字典 }\nprint(\"\\n\\n示例2：追踪字典操作\")\ndict_tracker = MutabilityTracker({'a': 1, 'b': 2})\nprint(f\"初始: {dict_tracker.get_obj()}\")\ndict_tracker.update({'c': 3, 'd': 4})\nprint(f\"更新后: {dict_tracker.get_obj()}\")\ndict_tracker.pop('b')\nprint(f\"删除后: {dict_tracker.get_obj()}\")\ndict_tracker.undo()\nprint(f\"撤销后: {dict_tracker.get_obj()}\")",

    "number": 2,
    "stem": "实现自动处理函数参数可变性的工具：\n1. 装饰器\n装饰器@safe_params：\n• 自动检测可变参数\n• 创建参数副本\n• 可配置深拷贝/浅拷贝\n2. 装饰器\n装饰器@immutable_return：\n• 将返回值转为不可变\n• 支持嵌套结构\n• 提供转换报告\n3. 工具函数\n工具函数：\n• make_immutable(obj)\n• is_deeply_immutable(obj)\n• compare_mutability(obj1, obj2)",
    "title": "函数参数安全化工具",
    "answer": "import copy\nfrom functools import wraps\nimport inspect\ndef safe_params(deep=False):\n    \"\"\"\n    自动安全化参数装饰器\n    功能：\n    1. 自动检测可变参数\n    2. 创建参数副本\n    3. 可配置深拷贝/浅拷贝\n    使用示例：\n    @safe_params(deep=True)\n    def my_function(data):\n        data.append(1)  # 不会影响外部\n    \"\"\"\n    def decorator(func):\n        @wraps(func)\n        def wrapper(*args, **kwargs):\n            # 处理位置参数\n            safe_args = []\n            for arg in args:\n                if _is_mutable(arg):\n                safe_args.append(copy.deepcopy(arg) if deep else copy.copy(arg))\n                else:\n                safe_args.append(arg)\n            # 处理关键字参数\n            safe_kwargs = {}\n            for key, value in kwargs.items():\n                if _is_mutable(value):\n                safe_kwargs[key] = copy.deepcopy(value) if deep else copy.copy(value)\n                else:\n                safe_kwargs[key] = value\n            return func(*safe_args, **safe_kwargs)\n        return wrapper\n    return decorator\ndef immutable_return(func):\n    \"\"\"\n    将返回值转为不可变装饰器\n    功能：\n    1. list -> tuple\n    2. dict -> frozenset of items\n    3. set -> frozenset\n    4. 支持嵌套结构\n    \"\"\"\n    @wraps(func)\n    def wrapper(*args, **kwargs):\n        result = func(*args, **kwargs)\n        return _make_immutable(result)\n    return wrapper\ndef _is_mutable(obj):\n    \"\"\"判断对象是否可变\"\"\"\n    immutable_types = (int, float, str, tuple, frozenset, bytes, bool, type(None))\n    return not isinstance(obj, immutable_types)\ndef _make_immutable(obj):\n    \"\"\"递归转换为不可变对象\"\"\"\n    if isinstance(obj, list):\n        return tuple(_make_immutable(item) for item in obj)\n    elif isinstance(obj, dict):\n        return frozenset((k, _make_immutable(v)) for k, v in obj.items())\n    elif isinstance(obj, set):\n        return frozenset(_make_immutable(item) for item in obj)\n    else:\n        return obj\ndef is_deeply_immutable(obj, visited=None):\n    \"\"\"\n    检查对象是否深度不可变\n    参数：\n    - obj: 要检查的对象\n    - visited: 已访问的对象集合（处理循环引用）\n    返回：\n    - bool: 是否深度不可变\n    \"\"\"\n    if visited is None:\n        visited = set()\n    # 避免循环引用\n    obj_id = id(obj)\n    if obj_id in visited:\n        return True\n    visited.add(obj_id)\n    # 检查基本不可变类型\n    if isinstance(obj, (int, float, str, bytes, bool, type(None))):\n        return True\n    # 检查frozenset\n    if isinstance(obj, frozenset):\n        return all(is_deeply_immutable(item, visited) for item in obj)\n    # 检查元组\n    if isinstance(obj, tuple):\n        return all(is_deeply_immutable(item, visited) for item in obj)\n    # 其他都是可变的\n    return False\ndef compare_mutability(obj1, obj2):\n    \"\"\"\n    比较两个对象的可变性\n    返回：\n    - dict: 包含两个对象的可变性信息\n    \"\"\"\n    return {\n        'obj1': {\n            'is_mutable': _is_mutable(obj1),\n            'is_deeply_immutable': is_deeply_immutable(obj1),\n            'type': type(obj1).__name__\n        },\n        'obj2': {\n            'is_mutable': _is_mutable(obj2),\n            'is_deeply_immutable': is_deeply_immutable(obj2),\n            'type': type(obj2).__name__\n        }\n# === 使用示例 === {#-使用示例--1 }\nprint(\"=== 函数参数安全化工具示例 ===\\n\")\n# 示例1：安全参数装饰器 {#示例1安全参数装饰器 }\n@safe_params(deep=True)\ndef modify_data(data):\n    \"\"\"这个函数会修改数据，但不影响外部\"\"\"\n    data.append(999)\n    if isinstance(data, list) and len(data) > 1:\n        data[0] = {'modified': True}\n    return data\noriginal = [{'value': 1}, {'value': 2}]\nprint(f\"原始数据: {original}\")\nresult = modify_data(original)\nprint(f\"返回值: {result}\")\nprint(f\"原始数据未变: {original}\\n\")\n# 示例2：不可变返回值 {#示例2不可变返回值 }\n@immutable_return\ndef create_data():\n    \"\"\"返回可变数据，但会被转换为不可变\"\"\"\n    return {\n        'items': [1, 2, 3],\n        'settings': {'debug': True},\n        'tags': {'python', 'programming'}\n    }\ndata = create_data()\nprint(f\"返回的数据（已冻结）: {data}\")\nprint(f\"数据类型: {type(data)}\\n\")\n# 示例3：深度不可变性检查 {#示例3深度不可变性检查 }\ntest_cases = [\n    (1, 2, 3),\n    ([1, 2], 3),\n    ((1, 2), (3, 4)),\n    frozenset([1, 2, 3])\n]\nprint(\"深度不可变性检查:\")\nfor obj in test_cases:\n    is_immutable = is_deeply_immutable(obj)\n    print(f\"\n            {obj}: {is_immutable}\")\n# 示例4：比较可变性 {#示例4比较可变性 }\nprint(\"\\n可变性比较:\")\ncomparison = compare_mutability([1, 2, 3], (1, 2, 3))\nfor obj_name, info in comparison.items():\n    print(f\"\n            {obj_name}: {info}\")",

    "stem": "实现不可变配置对象：\n1. ImmutableConfig类：\n• 初始化后不可修改\n• 支持嵌套配置\n• 提供只读访问\n2. ConfigBuilder类：\n• 构建器模式\n• 验证配置\n• 生成不可变配置\n3. 功能\n功能：\n• 从文件加载\n• 配置合并\n• 配置导出",
    "title": "配置对象设计",
    "answer": "from collections.abc import Mapping\nimport json\nfrom pathlib import Path\nclass ImmutableConfig(Mapping):\n    \"\"\"\n    不可变配置对象\n    特性：\n    1. 初始化后完全不可修改\n    2. 支持嵌套配置访问\n    3. 提供只读的字典接口\n    4. 可序列化\n    使用示例：\n    config = ImmutableConfig({'database': {'host': 'localhost'}})\n    print(config['database']['host'])\n    \"\"\"\n    def __init__(self, data):\n        \"\"\"\n        初始化配置\n        参数：\n        - data: 配置字典\n        \"\"\"\n        # 递归转换嵌套字典为ImmutableConfig\n        object.__setattr__(self, '_data', self._make_immutable(data))\n        object.__setattr__(self, '_hash', None)\n    def _make_immutable(self, obj):\n        \"\"\"递归转换为不可变配置\"\"\"\n        if isinstance(obj, dict):\n            return {k: self._make_immutable(v) for k, v in obj.items()}\n        elif isinstance(obj, list):\n            return tuple(self._make_immutable(item) for item in obj)\n        elif isinstance(obj, set):\n            return frozenset(self._make_immutable(item) for item in obj)\n    else:\n        return obj\n# 实现Mapping接口\ndef __getitem__(self, key):\n    \"\"\"获取配置项\"\"\"\n    value = self._data[key]\n    if isinstance(value, dict):\n        return ImmutableConfig(value)\n    return value\ndef __iter__(self):\n    \"\"\"迭代键\"\"\"\n    return iter(self._data)\ndef __len__(self):\n    \"\"\"配置项数量\"\"\"\n    return len(self._data)\n# 防止修改\ndef __setitem__(self, key, value):\n    \"\"\"禁止设置\"\"\"\n    raise TypeError(\"不可修改不可变配置\")\ndef __delitem__(self, key):\n    \"\"\"禁止删除\"\"\"\n    raise TypeError(\"不可修改不可变配置\")\ndef __setattr__(self, name, value):\n    \"\"\"禁止设置属性\"\"\"\n    raise AttributeError(\"不可修改不可变配置的属性\")\n# 哈希支持\ndef __hash__(self):\n    \"\"\"使配置可哈希\"\"\"\n    if self._hash is None:\n        object.__setattr__(self, '_hash', hash(self._to_hashable(self._data)))\n    return self._hash\ndef _to_hashable(self, obj):\n        \"\"\"转换为可哈希对象\"\"\"\n        if isinstance(obj, dict):\n            return tuple(sorted((k, self._to_hashable(v)) for k, v in obj.items()))\n        elif isinstance(obj, (list, tuple)):\n            return tuple(self._to_hashable(item) for item in obj)\n        elif isinstance(obj, set):\n            return frozenset(self._to_hashable(item) for item in obj)\n        else:\n            return obj\n    def __repr__(self):\n        \"\"\"字符串表示\"\"\"\n        return f\"ImmutableConfig({self._data})\"\n    def to_dict(self):\n        \"\"\"转换为普通字典\"\"\"\n        return self._data.copy()\nclass ConfigBuilder:\n    \"\"\"\n    配置构建器\n    功能：\n    1. 使用构建器模式创建配置\n    2. 支持链式调用\n    3. 配置验证\n    4. 生成不可变配置\n    使用示例：\n    config = (ConfigBuilder()\n        .set('database', {'host': 'localhost'})\n        .set('port', 8000)\n        .validate()\n        .build())\n    \"\"\"\n    def __init__(self):\n        \"\"\"初始化构建器\"\"\"\n        self._config = {}\n    self._validators = []\ndef set(self, key, value):\n    \"\"\"设置配置项\"\"\"\n    keys = key.split('.')\n    current = self._config\n    for k in keys[:-1]:\n        if k not in current:\n            current[k] = {}\n        current = current[k]\n    current[keys[-1]] = value\n    return self\ndef merge(self, other_config):\n    \"\"\"合并其他配置\"\"\"\n    self._deep_merge(self._config, other_config)\n    return self\ndef _deep_merge(self, base, update):\n    \"\"\"深度合并字典\"\"\"\n    for key, value in update.items():\n        if key in base and isinstance(base[key], dict) and isinstance(value, dict):\n            self._deep_merge(base[key], value)\n        else:\n            base[key] = value\ndef add_validator(self, validator_func):\n    \"\"\"添加验证器\"\"\"\n    self._validators.append(validator_func)\n    return self\ndef validate(self):\n    \"\"\"验证配置\"\"\"\n    for validator in self._validators:\n        if not validator(self._config):\n            raise ValueError(f\"配置验证失败: {validator.__name__}\")\n    return self\n    def load_from_file(self, filepath):\n        \"\"\"从文件加载配置\"\"\"\n        path = Path(filepath)\n        if path.suffix == '.json':\n            with path.open('r', encoding='utf-8') as f:\n                config = json.load(f)\n            self.merge(config)\n        return self\n    def build(self):\n        \"\"\"构建不可变配置\"\"\"\n        return ImmutableConfig(self._config)\n# === 使用示例 === {#-使用示例--2 }\nprint(\"=== 不可变配置系统示例 ===\\n\")\n# 示例1：创建不可变配置 {#示例1创建不可变配置 }\nconfig_data = {\n    'database': {\n        'host': 'localhost',\n        'port': 5432,\n        'credentials': {\n            'user': 'admin',\n            'password': 'secret'\n    },\n    'app': {\n        'debug': False,\n        'workers': 4\n    },\n    'features': ['auth', 'api', 'cache']\n}\nconfig = ImmutableConfig(config_data)\nprint(f\"配置: {config}\")\nprint(f\"数据库主机: {config['database']['host']}\")\nprint(f\"功能列表: {config['features']}\")\n# 尝试修改（会失败） {#尝试修改会失败 }\ntry:\n    config['database']['host'] = 'newhost'\nexcept TypeError as e:\n    print(f\"\\n✓ 修改被阻止: {e}\")\n# 示例2：使用构建器 {#示例2使用构建器 }\nprint(\"\\n使用ConfigBuilder:\")\n# 定义验证器 {#定义验证器 }\ndef validate_port(config):\n    \"\"\"验证端口号\"\"\"\n    if 'database' in config and 'port' in config['database']:\n        port = config['database']['port']\n        return 1024 <= port <= 65535\n    return True\n# 构建配置 {#构建配置 }\nbuilt_config = (ConfigBuilder()\n    .set('database.host', 'localhost')\n    .set('database.port', 5432)\n    .set('app.debug', True)\n    .add_validator(validate_port)\n    .validate()\n    .build())\nprint(f\"构建的配置: {built_config}\")\nprint(f\"配置哈希值: {hash(built_config)}\")\n# 配置可以作为字典键 {#配置可以作为字典键 }\nconfig_cache = {built_config: \"cached_data\"}\nprint(f\"\\n配置作为字典键: {len(config_cache)} 个条目\")\n评分说明：\n• 单选题：每题1分，共30分\n• 多选题：每题2分，选对但不全得1分，有错选不得分，共30分\n• 填空题：每空1分，共10分\n• 代码阅读题：每题3分，共15分\n• 程序设计题：5选3，每题5分，共15分\n• 总分：\n总分：100分",

    "answer": "from typing import Any, Dict\nclass ImmutableData:\n    \"\"\"\n    通用不可变数据类\n    特性：\n    1. 使用__slots__优化内存\n    2. 初始化后完全不可修改\n    3. 可哈希，能作为字典键\n    4. 提供replace()方法创建修改版本\n    使用示例：\n    person = ImmutableData(name=\"Alice\", age=30, city=\"Beijing\")\n    updated = person.replace(age=31)\n    \"\"\"\n    __slots__ = ('_data', '_hash')\n    def __init__(self, **kwargs):\n        \"\"\"\n        初始化不可变数据对象\n        参数：\n        - **kwargs: 任意属性键值对\n        \"\"\"\n        # 将所有参数转换为不可变形式\n        immutable_data = {}\n        for key, value in kwargs.items():\n            immutable_data[key] = self._make_immutable(value)\n        # 使用object.__setattr__绕过__setattr__限制\n        object.__setattr__(self, '_data', immutable_data)\n        object.__setattr__(self, '_hash', None)\n    def _make_immutable(self, value):\n        \"\"\"递归转换为不可变对象\"\"\"\n        if isinstance(value, dict):\n        return ImmutableData(**value)\n    elif isinstance(value, list):\n        return tuple(self._make_immutable(v) for v in value)\n    elif isinstance(value, set):\n        return frozenset(self._make_immutable(v) for v in value)\n    elif isinstance(value, ImmutableData):\n        return value\n    else:\n        return value\ndef __getattr__(self, name):\n    \"\"\"属性访问\"\"\"\n    if name.startswith('_'):\n        raise AttributeError(f\"'{type(self).__name__}' object has no attribute '{name}\n    try:\n        return self._data[name]\n    except KeyError:\n        raise AttributeError(f\"'{type(self).__name__}' object has no attribute '{name}\ndef __setattr__(self, name, value):\n    \"\"\"禁止设置属性\"\"\"\n    raise AttributeError(\"Cannot modify immutable object\")\ndef __delattr__(self, name):\n    \"\"\"禁止删除属性\"\"\"\n    raise AttributeError(\"Cannot modify immutable object\")\ndef __hash__(self):\n    \"\"\"计算哈希值\"\"\"\n    if self._hash is None:\n        items = tuple(sorted(self._data.items()))\n        hashable_items = self._to_hashable(items)\n        object.__setattr__(self, '_hash', hash(hashable_items))\n    return self._hash\ndef _to_hashable(self, obj):\n    \"\"\"转换为可哈希形式\"\"\"\n    if isinstance(obj, ImmutableData):\n        return self._to_hashable(tuple(sorted(obj._data.items())))\n    elif isinstance(obj, (list, tuple)):\n        return tuple(self._to_hashable(item) for item in obj)\n    elif isinstance(obj, dict):\n        return tuple(sorted((k, self._to_hashable(v)) for k, v in obj.items()))\n    else:\n        return obj\ndef __eq__(self, other):\n    \"\"\"相等性比较\"\"\"\n    if not isinstance(other, ImmutableData):\n        return False\n    return self._data == other._data\ndef __repr__(self):\n    \"\"\"字符串表示\"\"\"\n    items = ', '.join(f\"{k}={repr(v)}\" for k, v in self._data.items())\n    return f\"ImmutableData({items})\"\ndef replace(self, **changes):\n    \"\"\"\n    创建修改版本\n    参数：\n    - **changes: 要修改的属性\n    返回：\n    - ImmutableData: 新的不可变对象\n    \"\"\"\n    new_data = self._data.copy()\n    new_data.update(changes)\n    return ImmutableData(**new_data)\ndef to_dict(self):\n    \"\"\"转换为字典\"\"\"\n    result = {}\n    for key, value in self._data.items():\n        if isinstance(value, ImmutableData):\n            result[key] = value.to_dict()\n        elif isinstance(value, tuple):\n            result[key] = list(value)\n        elif isinstance(value, frozenset):\n                result[key] = set(value)\n            else:\n                result[key] = value\n        return result\n# === 使用示例 ===\nprint(\"=== 不可变数据类示例 ===\\n\")\n# 示例1：创建配置对象\nconfig = ImmutableData(\n    app_name=\"MyApp\",\n    version=\"1.0.0\",\n    database={\"host\": \"localhost\", \"port\": 5432},\n    features=[\"auth\", \"api\", \"cache\"]\n)\nprint(f\"配置: {config}\")\nprint(f\"应用名称: {config.app_name}\")\nprint(f\"数据库: {config.database}\")\nprint(f\"功能: {config.features}\")\n# 示例2：尝试修改（会失败）\ntry:\n    config.app_name = \"NewApp\"\nexcept AttributeError as e:\n    print(f\"\\n✓ 修改被阻止: {e}\")\n# 示例3：使用replace创建新版本\nupdated_config = config.replace(version=\"2.0.0\")\nprint(f\"\\n更新版本后: {updated_config}\")\nprint(f\"原配置不变: {config.version}\")\n# 示例4：作为字典键\ncache = {config: \"cached_result\"}\nprint(f\"\\n作为字典键: {len(cache)} 个条目\")\n# 示例5：数据传输对象\nperson = ImmutableData(\n    name=\"Alice\",\n    age=30,\n    address={\"city\": \"Beijing\", \"district\": \"Haidian\"}\n)\nprint(f\"\\n人员信息: {person}\")\nprint(f\"地址: {person.address}\")\nprint(f\"转为字典: {person.to_dict()}\")",

    "stem": "实现检测和分析对象可变性的工具：\n1. 检测函数\n检测函数：\n• is_mutable(obj)\n• find_mutable_parts(obj)\n• mutability_report(obj)\n2. 分析功能\n分析功能：\n• 递归检查嵌套结构\n• 生成可变性树\n• 提供修复建议\n3. 可视化\n可视化：\n• 打印可变性结构\n• 导出为JSON\n• 生成图表",
    "title": "可变性检测工具",
    "answer": "import sys\nfrom collections.abc import Mapping, Sequence\nimport json\ndef is_mutable(obj):\n    \"\"\"\n    判断对象是否可变\n    参数：\n    - obj: 要检查的对象\n    返回：\n    - bool: 是否可变\n    \"\"\"\n    immutable_types = (int, float, str, bytes, bool, type(None), frozenset)\n    # 基本不可变类型\n    if isinstance(obj, immutable_types):\n        return False\n    # 元组需要递归检查\n    if isinstance(obj, tuple):\n        return any(is_mutable(item) for item in obj)\n    # 其他都是可变的\n    return True\ndef find_mutable_parts(obj, path=\"root\"):\n    \"\"\"\n    查找对象中的可变部分\n    参数：\n    - obj: 要分析的对象\n    - path: 当前路径\n    返回：\n    - list: 可变部分的列表\n    \"\"\"\n    mutable_parts = []\n    if is_mutable(obj):\n        mutable_parts.append({\n            'path': path,\n            'type': type(obj).__name__,\n            'value': repr(obj)[:50]\n        })\n    # 递归检查容器\n    if isinstance(obj, dict):\n        for key, value in obj.items():\n            mutable_parts.extend(find_mutable_parts(value, f\"{path}[{repr(key)}]\"))\n    elif isinstance(obj, (list, tuple)):\n        for i, item in enumerate(obj):\n            mutable_parts.extend(find_mutable_parts(item, f\"{path}[{i}]\"))\n    elif isinstance(obj, set):\n        for item in obj:\n            mutable_parts.extend(find_mutable_parts(item, f\"{path}.item\"))\n    return mutable_parts\ndef mutability_report(obj, name=\"object\"):\n    \"\"\"\n    生成可变性报告\n    参数：\n    - obj: 要分析的对象\n    - name: 对象名称\n    返回：\n    - dict: 详细报告\n    \"\"\"\n    report = {\n        'name': name,\n        'type': type(obj).__name__,\n        'is_mutable': is_mutable(obj),\n        'size_bytes': sys.getsizeof(obj),\n        'mutable_parts': find_mutable_parts(obj, name)\n    }\n    # 添加建议\n    if report['mutable_parts']:\n        report['suggestion'] = \"对象包含可变部分，不适合作为字典键或缓存键\"\n    else:\n        report['suggestion'] = \"对象完全不可变，可以安全用作字典键\"\n    return report\ndef print_mutability_tree(obj, indent=0, name=\"root\"):\n    \"\"\"\n    打印可变性结构树\n    参数：\n    - obj: 要打印的对象\n    - indent: 缩进级别\n    - name: 节点名称\n    \"\"\"\n    prefix = \"  \" * indent\n    mutable_marker = \"🔴\" if is_mutable(obj) else \"🟢\"\n    print(f\"{prefix}{mutable_marker} {name}: {type(obj).__name__}\")\n    # 递归打印子节点\n    if isinstance(obj, dict) and indent < 5:\n        for key, value in list(obj.items())[:5]:\n            # 限制显示数量\n            print_mutability_tree(value, indent + 1, f\"[{repr(key)}]\")\n    elif isinstance(obj, (list, tuple)) and indent < 5:\n        for i, item in enumerate(obj[:5]):\n            # 限制显示数量\n            print_mutability_tree(item, indent + 1, f\"[{i}]\")\ndef export_report_json(report, filename):\n    \"\"\"\n    导出报告为JSON\n    参数：\n    - report: 报告字典\n    - filename: 文件名\n    \"\"\"\n    with open(filename, 'w', encoding='utf-8') as f:\n        json.dump(report, f, indent=2, ensure_ascii=False)\n    print(f\"报告已导出到{filename}\")\n# === 使用示例 ===\nprint(\"=== 可变性检测工具示例 ===\\n\")\n# 示例1：检测简单对象\ntest_objects = {\n    '整数': 42,\n    '字符串': \"hello\",\n    '列表': [1, 2, 3],\n    '元组': (1, 2, 3),\n    '混合元组': ([1, 2], 3),\n    '字典': {'a': 1, 'b': [2, 3]},\n    'frozenset': frozenset([1, 2, 3])\n}\nprint(\"基本类型可变性检测:\")\nfor name, obj in test_objects.items():\n    mutable = is_mutable(obj)\n    marker = \"🔴可变\" if mutable else \"🟢不可变\"\n    print(f\"\n            {marker} {name}: {type(obj).__name__}\")\n# 示例2：查找可变部分\nprint(\"\\n复杂对象可变部分分析:\")\ncomplex_obj = {\n    'name': 'config',\n    'values': [1, 2, [3, 4]],\n    'settings': {\n        'debug': True,\n        'data': [[5, 6], [7, 8]]\n    }\nmutable_parts = find_mutable_parts(complex_obj)\nfor part in mutable_parts:\n    print(f\"\n            {part['path']}: {part['type']}\")\n# 示例3：生成详细报告\nprint(\"\\n详细可变性报告:\")\nreport = mutability_report(complex_obj, \"complex_obj\")\nprint(f\"  名称: {report['name']}\")\nprint(f\"  类型: {report['type']}\")\nprint(f\"  可变: {report['is_mutable']}\")\nprint(f\"  大小: {report['size_bytes']} 字节\")\nprint(f\"  可变部分数量: {len(report['mutable_parts'])}\")\nprint(f\"  建议: {report['suggestion']}\")\n# 示例4：可变性树\nprint(\"\\n可变性结构树:\")\nprint_mutability_tree(complex_obj)\n# 示例5：对比不同数据结构\nprint(\"\\n\\n数据结构对比:\")\nstructures = {\n    '纯不可变': (1, 2, (3, 4), \"hello\"),\n    '混合结构': (1, [2, 3], {'a': 4}),\n    '纯可变': [1, 2, [3, 4], {'a': 5}]\n}\nfor name, struct in structures.items():\n    print(f\"\\n{name}:\")\n    print_mutability_tree(struct, name=name)",

    "stem": "实现防止意外修改的数据容器：\n1. SafeContainer类：\n• 包装列表/字典\n• 所有修改返回新对象\n• 原对象保持不变\n2. 操作追踪\n操作追踪：\n• 记录所有操作\n• 支持撤销/重做\n• 导出操作历史\n3. 性能优化\n性能优化：\n• 写时复制\n• 结构共享\n• 延迟计算",
    "title": "安全的数据操作类",
    "answer": "import copy\nfrom datetime import datetime\nclass SafeContainer:\n    \"\"\"\n    安全数据容器 - 所有修改返回新对象\n    特性：\n    1. 写时复制（Copy-on-Write）\n    2. 操作追踪\n    3. 撤销/重做支持\n    4. 原对象永不变\n    使用示例：\n    container = SafeContainer([1, 2, 3])\n    new_container = container.append(4)  # 返回新对象\n    \"\"\"\n    def __init__(self, data):\n        \"\"\"\n        初始化容器\n        参数：\n        - data: 初始数据（列表或字典）\n        \"\"\"\n        self._data = copy.deepcopy(data)\n        self._history = []\n        self._operation_log = []\n        self._redo_stack = []\n    # === 列表操作 ===\n    def append(self, item):\n        \"\"\"添加元素，返回新容器\"\"\"\n        if not isinstance(self._data, list):\n            raise TypeError(\"append只能用于列表\")\n        new_data = self._data.copy()\n        new_data.append(item)\n    return self._create_new(new_data, f\"append({repr(item)})\")\ndef extend(self, items):\n    \"\"\"扩展列表，返回新容器\"\"\"\n    if not isinstance(self._data, list):\n        raise TypeError(\"extend只能用于列表\")\n    new_data = self._data.copy()\n    new_data.extend(items)\n    return self._create_new(new_data, f\"extend({repr(items)})\")\ndef remove(self, item):\n    \"\"\"移除元素，返回新容器\"\"\"\n    if not isinstance(self._data, list):\n        raise TypeError(\"remove只能用于列表\")\n    new_data = self._data.copy()\n    new_data.remove(item)\n    return self._create_new(new_data, f\"remove({repr(item)})\")\n# === 字典操作 ===\ndef set(self, key, value):\n    \"\"\"设置键值，返回新容器\"\"\"\n    if not isinstance(self._data, dict):\n        raise TypeError(\"set只能用于字典\")\n    new_data = self._data.copy()\n    new_data[key] = value\n    return self._create_new(new_data, f\"set({repr(key)}, {repr(value)})\")\ndef delete(self, key):\n    \"\"\"删除键，返回新容器\"\"\"\n    if not isinstance(self._data, dict):\n        raise TypeError(\"delete只能用于字典\")\n    new_data = self._data.copy()\n    del new_data[key]\n    return self._create_new(new_data, f\"delete({repr(key)})\")\n# === 辅助方法 ===\ndef _create_new(self, new_data, operation):\n    \"\"\"创建新容器并记录操作\"\"\"\n    new_container = SafeContainer.__new__(SafeContainer)\n    new_container._data = new_data\n    new_container._history = self._history + [self._data]\n    new_container._operation_log = self._operation_log + [operation]\n    new_container._redo_stack = []\n    return new_container\ndef undo(self):\n    \"\"\"撤销最后一次操作\"\"\"\n    if not self._history:\n        print(\"没有可撤销的操作\")\n        return self\n    new_container = SafeContainer.__new__(SafeContainer)\n    new_container._data = self._history[-1]\n    new_container._history = self._history[:-1]\n    new_container._operation_log = self._operation_log[:-1]\n    new_container._redo_stack = self._redo_stack + [self._data]\n    return new_container\ndef redo(self):\n    \"\"\"重做操作\"\"\"\n    if not self._redo_stack:\n        print(\"没有可重做的操作\")\n        return self\n    new_container = SafeContainer.__new__(SafeContainer)\n    new_container._data = self._redo_stack[-1]\n    new_container._history = self._history + [self._data]\n    new_container._operation_log = self._operation_log + [\"redo\"]\n    new_container._redo_stack = self._redo_stack[:-1]\n    return new_container\ndef get_data(self):\n    \"\"\"获取当前数据（副本）\"\"\"\n    return copy.deepcopy(self._data)\ndef get_history(self):\n        \"\"\"获取操作历史\"\"\"\n        return list(zip(self._operation_log, self._history))\n    def __repr__(self):\n        \"\"\"字符串表示\"\"\"\n        return f\"SafeContainer({self._data})\"\n    def __len__(self):\n        \"\"\"长度\"\"\"\n        return len(self._data)\n# === 使用示例 ===\nprint(\"=== 安全数据容器示例 ===\\n\")\n# 示例1：列表操作\nprint(\"示例1：列表操作（写时复制）\")\ncontainer1 = SafeContainer([1, 2, 3])\nprint(f\"初始: {container1}\")\ncontainer2 = container1.append(4)\nprint(f\"添加4后: {container2}\")\nprint(f\"原容器不变: {container1}\")\ncontainer3 = container2.extend([5, 6])\nprint(f\"扩展后: {container3}\")\n# 示例2：操作链\nprint(\"\\n示例2：操作链\")\nresult = (SafeContainer([])\n    .append(1)\n    .append(2)\n    .append(3)\n    .extend([4, 5])\n    .remove(2))\nprint(f\"链式操作结果: {result}\")\n# 示例3：撤销/重做\nprint(\"\\n示例3：撤销/重做\")\nc1 = SafeContainer([1, 2])\nc2 = c1.append(3)\nc3 = c2.append(4)\nprint(f\"c3: {c3}\")\nc2_restored = c3.undo()\nprint(f\"撤销后: {c2_restored}\")\nc3_restored = c2_restored.redo()\nprint(f\"重做后: {c3_restored}\")\n# 示例4：操作历史\nprint(\"\\n示例4：操作历史\")\nhistory = c3.get_history()\nfor i, (op, state) in enumerate(history):\n    print(f\"\n            {i+1}. {op}: {state}\")\n# 示例5：字典操作\nprint(\"\\n示例5：字典操作\")\ndict_container = SafeContainer({'a': 1, 'b': 2})\nprint(f\"初始: {dict_container}\")\nupdated = dict_container.set('c', 3)\nprint(f\"添加c后: {updated}\")\nprint(f\"原字典不变: {dict_container}\")\ndeleted = updated.delete('b')\nprint(f\"删除b后: {deleted}\")\n评分说明：\n• 单选题：每题1分，共30分\n• 多选题：每题2分，选对但不全得1分，有错选不得分，共30分\n• 填空题：每空1分，共10分\n• 代码阅读题：每题3分，共15分\n• 程序设计题：5选3，每题5分，共15分\n• 总分：\n    总分：100分",

    "stem": "实现一个写时复制（Copy-on-Write）的列表容器：\n1. COWList类：\n• 初始时不复制数据\n• 第一次修改时才复制\n• 多个实例可以共享数据\n2. 功能要求\n功能要求：\n• 支持所有列表操作\n• 追踪引用计数\n• 优化内存使用\n3. 性能测试\n性能测试：\n• 对比普通列表\n• 测量内存占用\n• 测量操作速度",
    "title": "写时复制容器",
    "answer": "import copy\nfrom weakref import WeakValueDictionary\nclass COWList:\n    \"\"\"\n    写时复制（Copy-on-Write）列表容器\n    设计思路：\n    1. 多个实例共享同一份数据\n    2. 只有在修改时才复制数据\n    3. 使用引用计数追踪共享\n    4. 优化内存使用\n    特性：\n    - 读操作：O(1)，无复制开销\n    - 写操作：首次写时复制，后续O(1)\n    - 内存优化：多个实例共享数据\n    使用示例：\n    list1 = COWList([1, 2, 3])\n    list2 = COWList.from_cow(list1)  # 共享数据\n    list2.append(4)  # 触发复制\n    \"\"\"\n    # 类级别的数据存储池\n    _data_pool = WeakValueDictionary()\n    _next_id = 0\n    def __init__(self, data=None):\n        \"\"\"\n        初始化COW列表\n        参数：\n        - data: 初始数据\n        \"\"\"\n        if data is None:\n            data = []\n    # 为数据分配唯一ID\n    self._data_id = COWList._next_id\n    COWList._next_id += 1\n    # 存储数据\n    self._data = list(data)\n    self._is_shared = False\n    self._ref_count = 1\n@classmethod\ndef from_cow(cls, other):\n    \"\"\"\n    从另一个COW列表创建共享实例\n    参数：\n    - other: 另一个COWList实例\n    返回：\n    - COWList: 新实例，共享数据\n    \"\"\"\n    new_instance = cls.__new__(cls)\n    new_instance._data = other._data\n    new_instance._data_id = other._data_id\n    new_instance._is_shared = True\n    other._is_shared = True\n    new_instance._ref_count = other._ref_count\n    other._ref_count += 1\n    return new_instance\ndef _ensure_unique(self):\n    \"\"\"确保数据独占（写时复制）\"\"\"\n    if self._is_shared:\n        print(f\"  [COW] 触发复制，原引用计数: {self._ref_count}\")\n        self._data = self._data.copy()\n        self._is_shared = False\n        self._ref_count = 1\n# === 列表操作 ===\ndef append(self, item):\n    \"\"\"添加元素\"\"\"\n    self._ensure_unique()\n    self._data.append(item)\ndef extend(self, items):\n    \"\"\"扩展列表\"\"\"\n    self._ensure_unique()\n    self._data.extend(items)\ndef insert(self, index, item):\n    \"\"\"插入元素\"\"\"\n    self._ensure_unique()\n    self._data.insert(index, item)\ndef remove(self, item):\n    \"\"\"移除元素\"\"\"\n    self._ensure_unique()\n    self._data.remove(item)\ndef pop(self, index=-1):\n    \"\"\"弹出元素\"\"\"\n    self._ensure_unique()\n    return self._data.pop(index)\ndef clear(self):\n    \"\"\"清空列表\"\"\"\n    self._ensure_unique()\n    self._data.clear()\ndef sort(self, **kwargs):\n    \"\"\"排序\"\"\"\n    self._ensure_unique()\n    self._data.sort(**kwargs)\n# === 只读操作（不触发复制）===\ndef __getitem__(self, index):\n    \"\"\"获取元素\"\"\"\n    return self._data[index]\ndef __len__(self):\n    \"\"\"长度\"\"\"\n        return len(self._data)\n    def __iter__(self):\n        \"\"\"迭代\"\"\"\n        return iter(self._data)\n    def __repr__(self):\n        \"\"\"字符串表示\"\"\"\n        shared_marker = \" [共享]\" if self._is_shared else \"\"\n        return f\"COWList({self._data}){shared_marker}\"\n    def get_memory_info(self):\n        \"\"\"获取内存信息\"\"\"\n        import sys\n        return {\n            'data_size': sys.getsizeof(self._data),\n            'is_shared': self._is_shared,\n            'ref_count': self._ref_count,\n            'data_id': id(self._data)\n        }\n# === 使用示例 ===\nprint(\"=== 写时复制容器示例 ===\\n\")\n# 示例1：共享数据\nprint(\"示例1：数据共享\")\nlist1 = COWList([1, 2, 3, 4, 5])\nprint(f\"list1: {list1}\")\nprint(f\"内存信息: {list1.get_memory_info()}\")\nlist2 = COWList.from_cow(list1)\nprint(f\"\\nlist2（共享自list1）: {list2}\")\nprint(f\"list1数据ID: {id(list1._data)}\")\nprint(f\"list2数据ID: {id(list2._data)}\")\nprint(f\"数据共享: {id(list1._data) == id(list2._data)}\")\n# 示例2：写时复制\nprint(\"\\n示例2：写时复制触发\")\nprint(\"修改list2...\")\nlist2.append(6)\nprint(f\"list1: {list1}\")\nprint(f\"list2: {list2}\")\nprint(f\"list1数据ID: {id(list1._data)}\")\nprint(f\"list2数据ID: {id(list2._data)}\")\nprint(f\"数据已分离: {id(list1._data) != id(list2._data)}\")\n# 示例3：性能对比\nprint(\"\\n示例3：性能测试\")\nimport time\nimport sys\ndef test_normal_copy(n):\n    \"\"\"测试普通复制\"\"\"\n    lists = []\n    start = time.time()\n    base = list(range(n))\n    for _ in range(100):\n        lists.append(base.copy())\n    return time.time() - start, sum(sys.getsizeof(lst) for lst in lists)\ndef test_cow(n):\n    \"\"\"测试COW\"\"\"\n    lists = []\n    start = time.time()\n    base = COWList(list(range(n)))\n    for _ in range(100):\n        lists.append(COWList.from_cow(base))\n    return time.time() - start, sum(sys.getsizeof(lst._data) for lst in lists)\nn = 1000\nnormal_time, normal_memory = test_normal_copy(n)\ncow_time, cow_memory = test_cow(n)\nprint(f\"数据大小: {n}个元素\")\nprint(f\"普通复制: 时间={normal_time:.4f}s, 内存≈{normal_memory}字节\")\nprint(f\"COW复制:  时间={cow_time:.4f}s, 内存≈{cow_memory}字节\")\nprint(f\"内存节省: {(1 - cow_memory/normal_memory)*100:.1f}%\")",

    "stem": "实现一个完整的不可变配置系统：\n1. Config类：\n• 完全不可变\n• 支持嵌套配置\n• 提供便捷访问\n2. ConfigBuilder：\n• 构建器模式\n• 验证配置\n• 生成不可变实例\n3. 功能\n功能：\n• 配置合并\n• 配置继承\n• 配置导出",
    "title": "不可变配置系统",
    "answer": "from collections.abc import Mapping\nimport json\nfrom pathlib import Path\nclass Config(Mapping):\n    \"\"\"\n    完全不可变的配置对象\n    特性：\n    1. 初始化后完全不可修改\n    2. 支持嵌套配置（点号访问）\n    3. 可哈希，能作为字典键\n    4. 支持配置合并和继承\n    使用示例：\n    config = Config({'database': {'host': 'localhost'}})\n    print(config['database.host'])\n    \"\"\"\n    __slots__ = ('_data', '_hash')\n    def __init__(self, data):\n        \"\"\"\n        初始化配置\n        参数：\n        - data: 配置字典\n        \"\"\"\n        # 递归转换为不可变\n        object.__setattr__(self, '_data', self._freeze(data))\n        object.__setattr__(self, '_hash', None)\n    def _freeze(self, obj):\n        \"\"\"递归冻结对象\"\"\"\n        if isinstance(obj, dict):\n            return {k: self._freeze(v) for k, v in obj.items()}\n        elif isinstance(obj, list):\n            return tuple(self._freeze(item) for item in obj)\n    elif isinstance(obj, set):\n        return frozenset(self._freeze(item) for item in obj)\n    else:\n        return obj\ndef get(self, path, default=None):\n    \"\"\"\n    使用点号路径获取配置\n    参数：\n    - path: 配置路径，如 'database.host'\n    - default: 默认值\n    返回：\n    - 配置值或默认值\n    \"\"\"\n    keys = path.split('.')\n    value = self._data\n    for key in keys:\n        if isinstance(value, dict) and key in value:\n            value = value[key]\n        else:\n            return default\n    # 如果是字典，包装为Config\n    if isinstance(value, dict):\n        return Config(value)\n    return value\n# === Mapping接口 ===\ndef __getitem__(self, key):\n    \"\"\"支持字典访问\"\"\"\n    if '.' in key:\n        return self.get(key)\n    value = self._data[key]\n    if isinstance(value, dict):\n        return Config(value)\n    return value\ndef __iter__(self):\n    \"\"\"迭代键\"\"\"\n    return iter(self._data)\ndef __len__(self):\n    \"\"\"长度\"\"\"\n    return len(self._data)\n# === 禁止修改 ===\ndef __setattr__(self, name, value):\n    \"\"\"禁止设置属性\"\"\"\n    raise AttributeError(\"Config对象不可变\")\ndef __setitem__(self, key, value):\n    \"\"\"禁止设置项\"\"\"\n    raise TypeError(\"Config对象不可变\")\n# === 哈希支持 ===\ndef __hash__(self):\n    \"\"\"计算哈希值\"\"\"\n    if self._hash is None:\n        object.__setattr__(self, '_hash', hash(self._to_hashable(self._data)))\n    return self._hash\ndef _to_hashable(self, obj):\n    \"\"\"转换为可哈希对象\"\"\"\n    if isinstance(obj, dict):\n        return tuple(sorted((k, self._to_hashable(v)) for k, v in obj.items()))\n    elif isinstance(obj, (list, tuple)):\n        return tuple(self._to_hashable(item) for item in obj)\n    elif isinstance(obj, set):\n        return frozenset(self._to_hashable(item) for item in obj)\n    else:\n        return obj\ndef __repr__(self):\n    \"\"\"字符串表示\"\"\"\n    return f\"Config({self._data})\"\ndef merge(self, other):\n    \"\"\"\n    合并配置，返回新Config\n    参数：\n    - other: 另一个配置字典或Config对象\n    返回：\n    - Config: 合并后的新配置\n    \"\"\"\n    if isinstance(other, Config):\n        other = other._data\n    merged = self._deep_merge(self._data, other)\n    return Config(merged)\ndef _deep_merge(self, base, update):\n    \"\"\"深度合并字典\"\"\"\n    result = base.copy()\n    for key, value in update.items():\n        if key in result and isinstance(result[key], dict) and isinstance(value, dict)\n            result[key] = self._deep_merge(result[key], value)\n        else:\n            result[key] = value\n    return result\ndef to_dict(self):\n    \"\"\"转换为普通字典\"\"\"\n    return self._unfreeze(self._data)\ndef _unfreeze(self, obj):\n    \"\"\"递归解冻对象\"\"\"\n    if isinstance(obj, dict):\n        return {k: self._unfreeze(v) for k, v in obj.items()}\n    elif isinstance(obj, tuple):\n        return [self._unfreeze(item) for item in obj]\n    elif isinstance(obj, frozenset):\n        return {self._unfreeze(item) for item in obj}\n    else:\n        return obj\nclass ConfigBuilder:\n    \"\"\"\n    配置构建器\n    功能：\n    1. 流式API构建配置\n    2. 配置验证\n    3. 从文件加载\n    4. 配置继承\n    使用示例：\n    config = (ConfigBuilder()\n        .set('app.name', 'MyApp')\n        .set('app.version', '1.0')\n        .validate()\n        .build())\n    \"\"\"\n    def __init__(self):\n        \"\"\"初始化构建器\"\"\"\n        self._config = {}\n        self._validators = []\n    def set(self, path, value):\n        \"\"\"\n        设置配置值\n        参数：\n        - path: 配置路径（支持点号）\n        - value: 配置值\n        返回：\n        - self: 支持链式调用\n        \"\"\"\n        keys = path.split('.')\n        current = self._config\n        for key in keys[:-1]:\n        if key not in current:\n            current[key] = {}\n        current = current[key]\n    current[keys[-1]] = value\n    return self\ndef merge(self, config_dict):\n    \"\"\"\n    合并配置字典\n    参数：\n    - config_dict: 要合并的配置\n    返回：\n    - self: 支持链式调用\n    \"\"\"\n    self._deep_merge(self._config, config_dict)\n    return self\ndef _deep_merge(self, base, update):\n    \"\"\"深度合并\"\"\"\n    for key, value in update.items():\n        if key in base and isinstance(base[key], dict) and isinstance(value, dict):\n            self._deep_merge(base[key], value)\n        else:\n            base[key] = value\ndef load_from_file(self, filepath):\n    \"\"\"\n    从JSON文件加载配置\n    参数：\n    - filepath: 文件路径\n    返回：\n    - self: 支持链式调用\n    \"\"\"\n    path = Path(filepath)\n    if path.exists():\n        with path.open('r', encoding='utf-8') as f:\n            config = json.load(f)\n        self.merge(config)\n    return self\ndef add_validator(self, validator_func, error_msg=None):\n    \"\"\"\n    添加验证器\n    参数：\n    - validator_func: 验证函数，接收config字典，返回bool\n    - error_msg: 错误消息\n    返回：\n    - self: 支持链式调用\n    \"\"\"\n    self._validators.append((validator_func, error_msg))\n    return self\ndef validate(self):\n    \"\"\"\n    验证配置\n    返回：\n    - self: 支持链式调用\n    抛出：\n    - ValueError: 验证失败\n    \"\"\"\n    for validator, error_msg in self._validators:\n        if not validator(self._config):\n            msg = error_msg or f\"验证失败: {validator.__name__}\"\n            raise ValueError(msg) /* ---------- 判分（与 exam.py 保持一致） ---------- */
function norm(s){
  s = String(s||"").trim().toLowerCase();
  const map = {"（":"(","）":")","，":",","；":";","：":":","　":" ","“":"\"","”":"\"","‘":"'","’":"'"};
  s = s.replace(/[（），；：　“”‘’]/g, c => map[c] || c);
  s = s.replace(/\s+/g, "");
  return s.replace(/[。.;,]+$/g, "");
}
function splitParts(s){
  let parts = String(s||"").split(/[，,；;、\/|]+/);
  if(parts.length === 1 && s.includes("或")) parts = String(s).split("或");
  return parts.map(x=>x.trim()).filter(Boolean);
}
function letterSet(s){
  const m = String(s||"").toUpperCase().match(/[A-D]/g);
  return m ? new Set(m) : new Set();
}
function sameLetters(user, answer){
  const u = letterSet(user), a = letterSet(answer);
  if(u.size === 0) return false;
  if(u.size !== a.size) return false;
  for(const x of u) if(!a.has(x)) return false;
  return true;
}
function gradeFill(q, user){
  const ref = splitParts(q.answer), mine = splitParts(user);
  if(ref.length === 1){
    const r = norm(ref[0]), m = norm(user);
    return r.includes(m) || (m.includes(r) && m.length >= 2);
  }
  if(mine.length !== ref.length) return false;
  return mine.every((m,i)=> m.includes(norm(ref[i])) || norm(ref[i]).includes(m));
}
function autoGrade(q, user){
  if(q.type === "single" || q.type === "multi") return sameLetters(user, q.answer);
  if(q.type === "fill") return gradeFill(q, user);
  return null;
}

  h.a += 1; if(ok) h.c += 1; st.hist[k] = h;
  if(!ok){

    w.count += 1; w.streak = 0; st.wrong[k] = w;
  }else if(st.wrong[k]){

async function aiRequest(messages, {stream=false, maxTokens=3500}={}){
  if(!ai.key) throw new Error("还没有填写 API Key。点右上角「AI」→ 设置。");
  let res;
  try{
    res = await fetch("https://api.deepseek.com/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer " + ai.key},
      body: JSON.stringify({
        model: ai.model || "deepseek-flash",
        messages,
        temperature: 0.4,
        max_tokens: maxTokens,
        stream
      })
    });
  }catch(e){
    const hint = location.protocol === "file:"
      ? "如果一直失败，多半是浏览器不让本地网页联网：改用 Chrome 打开，或在文件夹里运行 python3 -m http.server 8000，再访问 http://localhost:8000/刷题.html。"
      : "检查网络或代理后重试。";
    throw new Error("网络错误：连不上 api.deepseek.com。" + hint);
  }
  if(!res.ok){
    let body = "";
    try{ body = await res.text(); }catch(e){}
    let extra = "";
    try{ const j = JSON.parse(body); extra = (j.error && j.error.message) || ""; }catch(e){}
    if(res.status === 401) throw new Error("API Key 无效或已过期（401）。请在「AI 设置」里检查。");
    if(res.status === 402) throw new Error("DeepSeek 账户余额不足（402），请先充值。");
    if(res.status === 429) throw new Error("请求太频繁（429），等几秒再试。");
    if(res.status === 400) throw new Error("请求参数有误（400）：" + (extra || body.slice(0,150)));
    throw new Error("请求失败（" + res.status + "）：" + (extra || body.slice(0,150)));
  }
  return res;
}

async function aiChatOnce(userText){
  const res = await aiRequest([{role:"system", content:AI_SYSTEM},{role:"user", content:userText}], {stream:false, maxTokens:200});
  const j = await res.json();
  return ((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "").trim();
}

async function aiStream(messages, onDelta){
  const res = await aiRequest(messages, {stream:true});
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", full = "";
  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    const lines = buf.split("\n");
    buf = lines.pop();
    for(const line of lines){
      const t = line.trim();
      if(!t.startsWith("data:")) continue;
      const payload = t.slice(5).trim();
      if(!payload || payload === "[DONE]") continue;
      try{
        const j = JSON.parse(payload);
        const d = j.choices && j.choices[0] && j.choices[0].delta;
        if(d && d.content){ full += d.content; onDelta(full); }
      }catch(e){}
    }
  }
  if(!full) throw new Error("AI 没有返回内容，请重试。");
  return full;
}

/* ---------- markdown 轻量渲染（无外部依赖） ---------- */
function mdToHTML(md){
  const parts = String(md).split("```");
  return parts.map((part, i)=>{
    if(i % 2 === 1){
      const code = part.replace(/^[a-zA-Z0-9_+\-]*\n/, "");
      return '<pre class="md-code">' + esc(code) + '</pre>';
    }
    let t = esc(part);
    t = t.replace(/`([^`\n]+)`/g, '<code class="md-inline">$1</code>');
    t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/^#{1,6}\s+(.+)$/gm, '<strong>$1</strong>');
    t = t.replace(/^(\s*)[-*]\s+(.+)$/gm, '$1• $2');
    t = t.replace(/^(\s*)(\d+)\.\s+(.+)$/gm, '$1$2. $3');
    return '<div class="md-text">' + t + '</div>';
  }).join("");
}

  const bubble = aiBubble("assistant", "");
  aiUI.busy = true;
  $("#aiSend").disabled = true;
  try{
    const full = await aiStream([{role:"system", content:aiSystemWithContext()}].concat(aiUI.messages), (txt)=>{
      bubble.innerHTML = mdToHTML(txt);

    });
    aiUI.messages.push({role:"assistant", content:full});
  }catch(err){
    bubble.classList.add("err");

}

      </div>
    </div>

    <div class="card" id="aiCard">
      <h2>${ico("bot")} AI 助教 <span class="dot ${ai.key?"on":""}"></span></h2>
      <div class="desc">${ai.key ? "已配置。答完题点「AI 讲解」，代码题点「AI 批改」，选中任意文字可问 AI。" : "用你自己的 DeepSeek API Key，让 AI 逐题讲解、批改代码、解释你选中的文字。"}</div>
      <div class="row">
        <button class="btn ${ai.key?"ghost":"ai"}" id="btnAIConfig">${ai.key ? "修改 AI 设置" : "配置 AI（填 API Key）"}</button>
      </div>
    </div>

    ${IS_MOBILE ? '<div class="footer-note" style="margin-top:0">手机模式：已隐藏代码练习，刷题和 AI 都可正常用；完整功能请用电脑打开</div>' : ''}
    <div class="footer-note">进度自动保存在这台设备上${storageOK ? "" : "（当前浏览器不允许保存，关闭后会丢失）"}</div>
  `;

  const fillSections = ()=>{
    const p = Number($("#selPaper").value);
    const counts = {};
    for(const q of QUESTIONS) if(q.paper === p) counts[q.section] = (counts[q.section]||0)+1;
    $("#selSection").innerHTML = `<option value="">全部题型（${Object.values(counts).reduce((a,b)=>a+b,0)} 题）</option>` +
