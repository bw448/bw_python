  };
  fillSections();
  $("#selPaper").onchange = fillSections;

  $("#btnStats").onclick = renderStats;
  $("#btnAI").onclick = ()=> ai.key ? aiOpen("AI 助教", "已配置 · 点题目里的按钮提问") : openSettings();
  $("#btnAIConfig").onclick = openSettings;

  $("#btnPaper").onclick = ()=>{
    const p = Number($("#selPaper").value);
    const sec = $("#selSection").value;
    const list = QUESTIONS.filter(q=>q.paper===p && (!sec || q.section===sec));
    startQuiz(list, "practice", {title:`第 ${p} 套` + (sec ? " · " + SECTION_SHORT[sec] : "")});
  };

  $("#countChips").onclick = e=>{
    const b = e.target.closest(".chip");
    if(!b) return;
    $("#countChips").querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", c===b));
  };
  $("#btnRandom").onclick = ()=>{
    const n = Number($("#countChips .chip.on").dataset.n);
    const type = $("#randType").value;
    const pool = type ? QUESTIONS.filter(q=>q.type === type) : QUESTIONS;
    if(!pool.length) return toast("这种题型没有题目");
    const take = Math.min(n, pool.length);
    const label = (type ? TYPE_NAME[type] + " · " : "") + "随机 " + take + " 题";
    startQuiz(shuffle(pool).slice(0, take), "practice", {title: label});
  };

  $("#btnWrong").onclick = ()=>{
    const list = wrongList();
    if(!list.length) return toast("错题本是空的");
    startQuiz(shuffle(list), "practice", {title:"错题重刷"});
  };

  $("#btnCode").onclick = ()=>{
    const list = QUESTIONS.filter(q=>q.type==="code_read"||q.type==="design");
    startQuiz(shuffle(list), "practice", {title:"代码题专项"});
  };

  $("#btnGuide").onclick = ()=>showGuide(true);

  if($("#btnFree")) $("#btnFree").onclick = renderFree;

  $("#btnMock").onclick = ()=>{
    const p = Number($("#selMockPaper").value);
    const mins = Number($("#selMinutes").value);
    const autoTypes = ["single","multi","fill"];
    const list = QUESTIONS.filter(q=>q.paper===p && autoTypes.includes(q.type));
    if(!list.length) return toast("这一套没有可自动判分的题");
    startQuiz(list, "mock", {title:`第 ${p} 套模拟考`, minutes:mins});
  };
}

/* ================= 答题会话 ================= */
let sess = null;

function startQuiz(list, mode, opts){
  aiUI.extraContext = "";
  if(cm){ cm = null; }
  sess = {
    mode, list,
    index: 0,
    records: list.map(q=>({q, ok:null, answered:false, user:"", selfGrade:null})),
    title: opts.title || "",
    minutes: opts.minutes || 0,
    endAt: opts.minutes ? Date.now() + opts.minutes*60000 : 0,
    timer: null,
    startedAt: Date.now()
  };
  renderQuestion();
}

function cur(){ return sess ? sess.list[sess.index] : null; }
function curRec(){ return sess ? sess.records[sess.index] : null; }
function typeBadge(q){ return TYPE_NAME[q.type] || q.type; }

function renderQuestion(){
  if(sess.index >= sess.list.length) return finishSession();
  const q = cur(), rec = curRec();
  const total = sess.list.length;
  const isMock = sess.mode === "mock";

  const optionsHTML = q.options ? Object.keys(q.options).map(k=>`
      <button class="opt" data-k="${k}">
        <span class="letter">${k}</span><span>${esc(q.options[k])}</span>
      </button>`).join("") : "";

  let answerArea = "";
  if(q.type === "single" || q.type === "multi"){
    answerArea = `<div class="options" id="options">${optionsHTML}</div>
      <div class="small muted" id="hint" style="margin-top:8px">${q.type==="multi" ? "可多选，选完点提交" : "选中后点提交"}</div>`;
  }else if(q.type === "fill"){
    answerArea = `<input class="textans" id="fillInput" placeholder="在这里输入答案${q.blanks>1 ? "，多个空用 | 分隔" : ""}" autocomplete="off">
      <div class="small muted" id="hint" style="margin-top:8px">${q.blanks>1 ? `本题共 ${q.blanks} 个空，用 | 分隔，例如：可变|不可变` : "注意拼写和大小写"}</div>`;
  }else{
    answerArea = `<div class="small muted" style="margin-top:14px;margin-bottom:6px">${ico("pencil",14)} 在这里写你的代码 / 答案</div>
      <textarea class="textans" id="codeInput" spellcheck="false" placeholder="Tab 缩进 4 格；写完点「AI 批改」，或按 Ctrl/Cmd + Enter"></textarea>`;
  }

  $("#app").innerHTML = `
    <div class="quizbar">
      <div class="row" style="gap:6px;flex:none">
        <button class="iconbtn" id="btnBack">${ico("arrowLeft",16)} 返回</button>
        <button class="iconbtn" id="btnAIFree" title="问 AI" aria-label="问 AI">${ico("bot",16)}</button>
      </div>
      <div class="meta">${esc(sess.title)} · 第 ${q.number} 题</div>
      ${isMock ? `<div class="timer" id="timer">--:--</div>` : `<div class="timer ok">${sess.index+1}/${total}</div>`}
    </div>

    <div class="qcard">
      <div class="qtag">
        <span class="badge">第 ${q.paper} 套</span>
        <span class="badge type">${typeBadge(q)}</span>
        ${q.title ? `<span class="badge">${esc(q.title)}</span>` : ""}
      </div>
      <div class="stem">${esc(q.stem)}</div>
      ${q.body ? `<div class="body">${esc(q.body)}</div>` : ""}
      ${answerArea}
      <div id="feedback"></div>
      <div class="actions" id="actions"></div>
    </div>
    <div class="footer-note">选中题目里任意文字 → 点「问 AI」，会自动结合这道题解释</div>
  `;

  if(rec.answered){
    applyAnswered(q, rec);
  }else{
    wireInputs(q);
    const isCode = (q.type === "code_read" || q.type === "design");
    $("#actions").innerHTML = `
      <button class="btn ghost" id="btnHint">${ico("bulb",16)} AI 提示</button>
      ${isCode ? `<button class="btn ghost" id="btnReveal">查看参考答案</button>
                  <button class="btn ai" id="btnAIGrade">${ico("sparkles",16)} AI 批改</button>` : ""}
      <button class="btn" id="btnSubmit">提交${isMock ? "并下一题" : ""}</button>
    `;
    $("#btnSubmit").onclick = ()=>submitCurrent();
    $("#btnHint").onclick = ()=>aiHintCurrent();
    if($("#btnReveal")) $("#btnReveal").onclick = ()=>revealSelfGrade();
    if($("#btnAIGrade")) $("#btnAIGrade").onclick = ()=>aiGradeCode();
  }

  $("#btnBack").onclick = ()=>{
    if(confirm("退出后本次练习的记录不会保存，确定退出？")){ stopTimer(); aiClose(); renderHome(); }
  };
  $("#btnAIFree").onclick = ()=>{
    aiUI.messages = [];
    aiBubbleReset();
    aiOpen("AI 助教");
    const hint = document.createElement("div");
    hint.className = "ai-msg assistant";
    hint.innerHTML = '<div class="md-text">这道题的题目已经自动带入了，直接问就行。\n\n也可以选中题目里的任意文字，点浮出来的「问 AI」。</div>';
    $("#aiBody").appendChild(hint);
  };
  if(isMock) startTimer();
  window.scrollTo({top:0, behavior:"instant"});
}

function wireInputs(q){
  const opts = $("#options");
  if(opts){
    opts.querySelectorAll(".opt").forEach(btn=>{
      btn.onclick = ()=>{
        if(q.type === "single"){
          opts.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel", b===btn));
        }else{
          btn.classList.toggle("sel");
        }
      };
    });
  }
  const inp = $("#fillInput");
  if(inp) inp.onkeydown = e=>{ if(e.key === "Enter"){ e.preventDefault(); submitCurrent(); } };
  const code = $("#codeInput");
  if(code){
    code.onkeydown = e=>{
      if(e.key === "Tab"){
        e.preventDefault();
        const s = code.selectionStart, en = code.selectionEnd;
        code.value = code.value.slice(0,s) + "    " + code.value.slice(en);
        code.selectionStart = code.selectionEnd = s + 4;
      }
      if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); aiGradeCode(); }
    };
  }
}

function pickedLetters(q){
  if(q.type === "single"){
    const b = $("#options .opt.sel");
    return b ? b.dataset.k : "";
  }
  return Array.from($("#options .opt.sel")).map(b=>b.dataset.k).sort().join("");
}

function revealSelfGrade(){
  const q = cur(), rec = curRec();
  rec.user = (($("#codeInput")||{}).value || "");
  const btn = $("#btnReveal");
  if(btn){ btn.remove(); }
  $("#feedback").innerHTML = `
    <div class="feedback">
      <div class="verdict muted">参考答案</div>
      <div class="answer-ref">${esc(q.answer)}</div>
      ${q.explanation ? `<div class="explain"><h4>解析</h4>${esc(q.explanation)}</div>` : `<div class="small muted" style="margin-top:8px">题库未提供解析，可以点「AI 讲解」让它讲一讲。</div>`}
    </div>`;
  $("#actions").innerHTML = `
    <button class="btn ghost" id="btnAIGrade2">${ico("sparkles",16)} AI 批改我的代码</button>
    <button class="btn" id="btnRight" style="background:var(--good);color:#06281a">答对了</button>
    <button class="btn ghost" id="btnWrong">没答对</button>
  `;
  $("#btnRight").onclick = ()=>selfGrade(true);
  $("#btnWrong").onclick = ()=>selfGrade(false);
  if($("#btnAIGrade2")) $("#btnAIGrade2").onclick = ()=>aiGradeCode();
}

function selfGrade(ok){
  const q = cur(), rec = curRec();
  rec.answered = true; rec.ok = ok; rec.selfGrade = ok;
  rec.user = (($("#codeInput")||{}).value || "");
  recordAnswer(q, ok);
  if(sess.mode === "mock"){ nextQuestion(); return; }
  applyAnswered(q, rec);
}

function submitCurrent(){
  const q = cur(), rec = curRec();
  if(rec.answered) return nextQuestion();

  let user = "";
  if(q.type === "single" || q.type === "multi") user = pickedLetters(q);
  if(q.type === "fill") user = (($("#fillInput")||{}).value || "").trim();
  if(q.type === "code_read" || q.type === "design") user = (($("#codeInput")||{}).value || "");

  if((q.type === "single" || q.type === "multi") && !user) return toast("先选一个答案");
  if(q.type === "fill" && !user) return toast("先填写答案");

  const ok = autoGrade(q, user);
  rec.answered = true; rec.ok = ok; rec.user = user;
  recordAnswer(q, ok);

  if(sess.mode === "mock"){ nextQuestion(); return; }
  applyAnswered(q, rec);
}

function applyAnswered(q, rec){
  const hint = document.getElementById("hint");
  if(hint) hint.remove();
  const opts = $("#options");
  if(opts){
    const correct = letterSet(q.answer);
    const mine = letterSet(rec.user);
    opts.querySelectorAll(".opt").forEach(b=>{
      const k = b.dataset.k;
      b.disabled = true;
      if(correct.has(k)) b.classList.add("right");
      else if(mine.has(k)) b.classList.add("wrong");
    });
  }
  if(q.type === "fill" && $("#fillInput")){ $("#fillInput").value = rec.user; $("#fillInput").disabled = true; }
  if((q.type === "code_read" || q.type === "design") && $("#codeInput")){
    $("#codeInput").value = rec.user || ""; $("#codeInput").disabled = true;
  }

  const okText = rec.ok === true ? (ico("check",16) + " 回答正确") : rec.ok === false ? (ico("x",16) + " 回答错误") : "已记录";
  const noExplain = !q.explanation && (q.type === "code_read" || q.type === "design");
  $("#feedback").innerHTML = `
    <div class="feedback ${rec.ok===true?"good":rec.ok===false?"bad":""}">
      <div class="verdict">${okText}</div>
      <div class="small muted">参考答案</div>
      <div class="answer-ref">${esc(q.answer)}</div>
      ${q.explanation ? `<div class="explain"><h4>解析</h4>${esc(q.explanation)}</div>`
        : (noExplain ? `<div class="small muted" style="margin-top:8px">题库未提供解析，点下面的「AI 讲解」让它讲一讲。</div>` : "")}
    </div>`;
  $("#actions").innerHTML = `
    <button class="btn ai" id="btnAIExplain">${ico("sparkles",16)} AI 讲解</button>
    <button class="btn" id="btnNext">${sess.index+1 >= sess.list.length ? "完成本次练习" : "下一题 →"}</button>
  `;
  $("#btnAIExplain").onclick = ()=>aiExplainCurrent();
  $("#btnNext").onclick = nextQuestion;
}

function nextQuestion(){
  if(sess.index + 1 >= sess.list.length){
    if(sess.mode === "mock") return finishSession();
    sess.index += 1; return renderQuestion();
  }
  sess.index += 1;
  renderQuestion();
}

/* ================= 计时 ================= */
function startTimer(){
  stopTimer();
  const tick = ()=>{
    if(!sess) return;
    const left = (sess.endAt - Date.now())/1000;
    const el = $("#timer");
    if(el) el.textContent = fmtTime(left);
    if(left <= 0){
      stopTimer();
      toast("时间到，已自动交卷");
      finishSession();
    }
  };
  tick();
  sess.timer = setInterval(tick, 1000);
}
function stopTimer(){ if(sess && sess.timer){ clearInterval(sess.timer); sess.timer = null; } }

/* ================= 结算 ================= */
function finishSession(){
  stopTimer();
  aiClose();
  const done = sess.records.filter(r=>r.answered);
  const correct = done.filter(r=>r.ok).length;
  const wrongs = done.filter(r=>r.ok === false);
  const skipped = sess.list.length - done.length;
  const isMock = sess.mode === "mock";
  const elapsed = Math.round((Date.now() - sess.startedAt)/1000);

  let points = 0, maxPoints = 0;
  if(isMock){
    for(const r of sess.records){
      const p = POINTS[r.q.type] || 1;
      maxPoints += p;
      if(r.ok) points += p;
    }
  }

  const reviewHTML = wrongs.length ? wrongs.map(r=>`
    <div class="reviewitem">
      <div class="small muted" style="margin-bottom:6px">第 ${r.q.paper} 套 · ${typeBadge(r.q)} · 第 ${r.q.number} 题</div>
      <div class="s">${esc(r.q.stem)}</div>
      <div class="small" style="margin-top:8px"><span class="muted">你的答案：</span>${esc(r.user || "（未作答）")}</div>
      <div class="small"><span class="muted">正确答案：</span><span style="color:var(--good)">${esc(r.q.answer)}</span></div>
    </div>`).join("") : `<div class="small muted">没有错题，漂亮。</div>`;

  const savedRecords = sess.records;
  $("#app").innerHTML = `
    <div class="top">
      <div class="brand"><div class="logo">${isMock ? ico("timer",20) : ico("check",20)}</div>
        <div><h1>${isMock ? "模拟考结束" : "练习完成"}</h1>
        <div class="sub">${esc(sess.title)} · 用时 ${fmtTime(elapsed)}</div></div>
      </div>
    </div>

    <div class="card" style="text-align:center">
      ${isMock ? `<div class="big">${points}<small> / ${maxPoints} 分</small></div>`
               : `<div class="big">${done.length ? Math.round(correct/done.length*100) : 0}<small>% 正确率</small></div>`}
      <div class="resultgrid">
        <div class="tile"><div class="k">作答</div><div class="v">${done.length}<small>题</small></div></div>
        <div class="tile"><div class="k">答对</div><div class="v" style="color:var(--good)">${correct}</div></div>
        <div class="tile"><div class="k">答错</div><div class="v" style="color:var(--bad)">${wrongs.length}</div></div>
      </div>
      ${skipped > 0 ? `<div class="small muted">还有 ${skipped} 题未作答</div>` : ""}
    </div>

    <div class="card">
      <h2 style="margin-bottom:10px">本次错题（${wrongs.length}）</h2>
      ${reviewHTML}
    </div>

    <div class="actions">
      <button class="btn" id="btnHome">返回首页</button>
      ${wrongs.length ? `<button class="btn ghost" id="btnAgain">只刷本次错题</button>` : ""}
    </div>
  `;
  $("#btnHome").onclick = ()=>{ sess=null; renderHome(); };
  if($("#btnAgain")) $("#btnAgain").onclick = ()=>{ const list = wrongs.map(r=>r.q); startQuiz(list, "practice", {title:"本次错题"}); };
}

/* ================= 统计 ================= */
function renderStats(){
  const acc = st.total ? Math.round(st.correct/st.total*100) : 0;
  const byPaper = {}, bySection = {};
  for(const q of QUESTIONS){
    const h = st.hist[qkey(q)];
    if(!h) continue;
    const p = byPaper[q.paper] || (byPaper[q.paper] = {a:0,c:0});
    p.a += h.a; p.c += h.c;
    const s = bySection[q.section] || (bySection[q.section] = {a:0,c:0});
    s.a += h.a; s.c += h.c;
  }
  const rows = obj => Object.keys(obj).sort().map(k=>{
    const o = obj[k], r = o.a ? Math.round(o.c/o.a*100) : 0;
    return `<tr><td>${esc(k)}</td><td>${o.a}</td><td>${o.c}</td>
      <td><div class="bar"><i style="width:${r}%"></i></div></td><td>${r}%</td></tr>`;
  }).join("") || `<tr><td colspan="5" class="muted">还没有数据</td></tr>`;

  const paperRows = rows(Object.fromEntries(Object.entries(byPaper).map(([k,v])=>["第 "+k+" 套",v])));
  const secRows = rows(Object.fromEntries(Object.entries(bySection).map(([k,v])=>[SECTION_SHORT[k]||k,v])));

  $("#app").innerHTML = `
    <div class="quizbar">
      <button class="iconbtn" id="btnBack">← 返回</button>
      <div class="meta">学习统计</div><div style="width:64px"></div>
    </div>

    <div class="tiles">
      <div class="tile"><div class="k">累计作答</div><div class="v">${st.total}<small>题</small></div></div>
      <div class="tile"><div class="k">总体正确率</div><div class="v">${acc}<small>%</small></div></div>
      <div class="tile"><div class="k">当前错题</div><div class="v">${wrongList().length}<small>题</small></div></div>
    </div>

    <div class="card">
      <h2>按套卷</h2>
      <table><thead><tr><th>套卷</th><th>作答</th><th>答对</th><th style="width:30%">正确率</th><th></th></tr></thead>
      <tbody>${paperRows}</tbody></table>
    </div>

    <div class="card">
      <h2>按题型</h2>
      <table><thead><tr><th>题型</th><th>作答</th><th>答对</th><th style="width:30%">正确率</th><th></th></tr></thead>
      <tbody>${secRows}</tbody></table>
    </div>

    <div class="card">
      <h2>数据</h2>
      <div class="desc">所有进度只保存在这台设备、这个浏览器里。</div>
      <button class="btn ghost" id="btnReset" style="color:var(--bad)">清空所有进度</button>
    </div>
  `;
  $("#btnBack").onclick = renderHome;
  $("#btnReset").onclick = ()=>{
    if(confirm("确定清空所有作答记录、正确率和错题本？此操作不可撤销。")){
      st = {total:0, correct:0, wrong:{}, hist:{}}; saveState(); toast("已清空"); renderStats();
    }
  };
}

/* ================= 自由练习 ================= */
const IDE_KEY = "pyquiz.ide.v1";
const FREE_KEY = "pyquiz.free.v1";
const FREE_DEFAULT = [
  "# 在这里随便写 Python：Ctrl/Cmd + Enter 运行，Ctrl/Cmd + S 保存",
  "class Student:",
  "    def __init__(self, name):",
  "        self.name = name",
  "",
  's = Student("小明")',
  "print(s.name)",
  ""
].join("\n");

let ide = loadIDE();
function loadIDE(){
  try{
    const raw = localStorage.getItem(IDE_KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(o && Array.isArray(o.files) && o.files.length && o.active) return o;
    }
  }catch(e){}
  let legacy = null;
  try{ legacy = localStorage.getItem(FREE_KEY); }catch(e){}
  return {
    files: [{ id:"f1", name:"main.py", code: legacy == null ? FREE_DEFAULT : legacy }],
    active: "f1"
  };
}
function saveIDE(){
  try{ localStorage.setItem(IDE_KEY, JSON.stringify(ide)); return true; }
  catch(e){ return false; }
}
function activeFile(){
  return ide.files.find(f=>f.id === ide.active) || ide.files[0];
}
let ideSaveTimer = null;
function saveIDEDebounced(){
  clearTimeout(ideSaveTimer);
  ideSaveTimer = setTimeout(()=>{ saveIDE(); markSaved(); }, 400);
}
function markSaved(){
  const el = document.getElementById("saveState");
  if(el) el.textContent = "已保存";
}
function newFileId(){ return "f" + Date.now().toString(36) + Math.floor(Math.random()*1000).toString(36); }

/* ---- 编辑器（CodeMirror 5；加载失败自动退回纯文本框） ---- */
let cm = null;
let cmPromise = null;
const CM_SOURCES = [

function loadScriptSeq(srcs){
  return srcs.reduce((p, src)=>p.then(()=>new Promise((res, rej)=>{
    const s = document.createElement("script");
    s.src = src;
    s.onload = ()=>res();
    s.onerror = ()=>rej(new Error("加载失败"));
    document.head.appendChild(s);
  })), Promise.resolve());
}
function ensureCodeMirror(){
  if(window.CodeMirror) return Promise.resolve(true);
  if(cmPromise) return cmPromise;
  cmPromise = (async ()=>{
    let lastErr = null;
    for(const src of CM_SOURCES){
      try{
        src.css.forEach(href=>{
          const l = document.createElement("link");
          l.rel = "stylesheet"; l.href = href;
          document.head.appendChild(l);
        });
        await loadScriptSeq(src.js);
        if(window.CodeMirror) return true;
        throw new Error("CodeMirror 未初始化");
      }catch(e){ lastErr = e; }
    }
    cmPromise = null;
    throw lastErr || new Error("编辑器加载失败");
  })();
  return cmPromise;
}

  "elif","else","except","finally","for","from","global","if","import","in","is","lambda","nonlocal","not","or","pass",

  "compile","complex","delattr","dict","dir","divmod","enumerate","eval","exec","filter","float","format","frozenset",

  "__init__","__str__","__repr__","__len__","__iter__","__next__","__getitem__","__setitem__","__del__","__new__",
  "__call__","__eq__","__lt__","__enter__","__exit__","__add__","__contains__"];

const ATTR_HINTS = {
  np: ["arange","array","zeros","ones","linspace","mean","median","sum","max","min","std","dot","reshape","transpose","random","linalg","sqrt","exp","log","pi","inf","concatenate","stack"],

  matplotlib: ["pyplot","use","rcParams"],

function pythonHint(editor){
  const cur = editor.getCursor();
  const before = editor.getLine(cur.line).slice(0, cur.ch);
  const dot = before.match(/([A-Za-z_][A-Za-z0-9_]*)\.([A-Za-z0-9_]*)$/);
  let word, pool;
  if(dot){
    word = dot[2];
    pool = ATTR_HINTS[dot[1]] || ATTR_HINTS[dot[1].toLowerCase()] || [];
  }else{
    const m = before.match(/[A-Za-z_][A-Za-z0-9_]*$/);
    if(!m) return null;
    word = m[0];
    const ids = new Set();
    (editor.getValue().match(/[A-Za-z_][A-Za-z0-9_]*/g) || []).forEach(x=>ids.add(x));
    pool = PY_KEYWORDS.concat(PY_BUILTINS, Array.from(ids));
  }
  const from = CodeMirror.Pos(cur.line, cur.ch - word.length);
  const low = word.toLowerCase();
  const seen = new Set();
  const list = [];
  for(const x of pool){
    if(x === word || seen.has(x)) continue;
    if(x.toLowerCase().startsWith(low)){ seen.add(x); list.push(x); }
  }
  if(!list.length) return null;
  list.sort();
  return {list: list, from: from, to: CodeMirror.Pos(cur.line, cur.ch)};
}

function showPythonHint(editor){
  if(!editor || !editor.showHint) return;
  editor.showHint({hint: pythonHint, completeSingle: false});
}

    cm.setValue(activeFile().code);
    cm.on("change", ()=>{ activeFile().code = cm.getValue(); saveIDEDebounced(); });
    cm.on("inputRead", (editor, change)=>{
      if(change.origin !== "+input") return;
      const t = change.text[0];
      if(!t) return;
      const cur = editor.getCursor();
      const before = editor.getLine(cur.line).slice(0, cur.ch);
      const last = t.charAt(t.length - 1);
      if(last === "." || /[A-Za-z_][A-Za-z0-9_]+$/.test(before)){
        showPythonHint(editor);
      }
    });
    cm.on("cursorActivity", ()=>{
      const p = cm.getCursor();
      const el = document.getElementById("cursorPos");
      if(el) el.textContent = "第 " + (p.line + 1) + " 行 · 第 " + (p.ch + 1) + " 列";
    });
    cm.focus();
  }).catch(()=>{
    const note = document.getElementById("editorNote");
    if(note) note.textContent = "编辑器组件没加载出来，已退回纯文本框（运行、AI 功能照常）";

    ta.style.minHeight = "340px";
    ta.style.marginTop = "0";
    ta.oninput = ()=>{ activeFile().code = ta.value; saveIDEDebounced(); };
    ta.onkeydown = e=>{
      if(e.key === "Tab"){
        e.preventDefault();
        const s = ta.selectionStart, en = ta.selectionEnd;
        ta.value = ta.value.slice(0,s) + "    " + ta.value.slice(en);
        ta.selectionStart = ta.selectionEnd = s + 4;
        activeFile().code = ta.value; saveIDEDebounced();
      }
      if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); runFreeCode(); }
    };
  });
}

/* ---- 浏览器里的 Python（Pyodide，首次运行才下载） ---- */
let pyPromise = null;
function loadPyodideFrom(base){
  return new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = base + "pyodide.js";
    s.onload = async ()=>{
      try{ resolve(await loadPyodide({indexURL: base})); }
      catch(e){ reject(e); }
    };
    s.onerror = ()=>reject(new Error("脚本下载失败"));
    document.head.appendChild(s);
  });
}
function ensurePyodide(){
  if(pyPromise) return pyPromise;
  pyPromise = (async ()=>{
    const bases = [
      "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/",
      "https://fastly.jsdelivr.net/pyodide/v0.26.4/full/"
    ];
    let lastErr = null;
    for(const base of bases){
      try{ return await loadPyodideFrom(base); }
      catch(e){ lastErr = e; }
    }
    pyPromise = null;
    throw lastErr || new Error("无法加载 Python 环境");
  })();
  return pyPromise;
}

/* ---- 常用数据科学包：首次用到才下载，之后走浏览器缓存 ---- */
const loadedPkgs = new Set();
function packagesNeeded(code){
  const want = [];
  if(/(^|\n)\s*(import\s+numpy|from\s+numpy)\b/.test(code)) want.push("numpy");
  if(/(^|\n)\s*(import\s+pandas|from\s+pandas)\b/.test(code)) want.push("pandas");
  if(/(^|\n)\s*(import\s+matplotlib|from\s+matplotlib)\b/.test(code)) want.push("matplotlib");
  return want.filter(p=>!loadedPkgs.has(p));
}
async function ensurePackages(py, code, out){
  const todo = packagesNeeded(code);
  if(todo.length){
    out.textContent = "正在下载 " + todo.join(" / ") + "（首次使用，之后会缓存）…";
    await py.loadPackage(todo, {messageCallback: function(){}});
    todo.forEach(p=>loadedPkgs.add(p));
  }
  if(loadedPkgs.has("matplotlib")){
    await py.runPythonAsync("import matplotlib; matplotlib.use('AGG')");
  }
}

  "def __pyquiz_grab():",

].join("\n");

let lastTraceback = "";
async function runFreeCode(){
  const code = freeValue();
  if(!code.trim()) return toast("先写点代码");
  const out = $("#out"), card = $("#outCard"), btn = $("#btnRun"), errBtn = $("#btnAIErr");
  card.style.display = "";
  out.classList.remove("err");
  out.textContent = "正在准备 Python 环境…（首次约 10 MB，请稍等）";
  showFigures([]);
  if(errBtn) errBtn.style.display = "none";
  lastTraceback = "";
  btn.disabled = true; btn.textContent = "运行中…";
  try{
    const py = await ensurePyodide();
    let buf = "";
    py.setStdout({batched: s=>{ buf += s + "\n"; out.textContent = buf; }});
    py.setStderr({batched: s=>{ buf += s + "\n"; out.textContent = buf; }});
    try{ await ensurePackages(py, code, out); }
    catch(pkgErr){
      out.classList.add("err");
      out.textContent = "依赖包下载失败：" + ((pkgErr && pkgErr.message) || pkgErr) +
        "\n\n可能是网络问题，稍后再试。";
      return;
    }
    out.textContent = "";
    let result;
    try{
      result = await py.runPythonAsync(code);
    }catch(err){
      lastTraceback = String((err && (err.message || err)) || "运行出错");
      out.classList.add("err");
      out.textContent = lastTraceback;
      if(errBtn) errBtn.style.display = "";
      return;
    }
    if(result !== undefined && result !== null && String(result) !== "None"){
      out.textContent += (out.textContent ? "\n" : "") + "→ " + String(result);
    }
    if(!out.textContent) out.textContent = "（运行结束，没有输出）";
    try{
      const figs = await py.runPythonAsync(FIG_GRAB);
      const arr = figs && figs.toJs ? Array.from(figs.toJs()) : [];
      showFigures(arr);
    }catch(e){}
  }catch(err){
    out.classList.add("err");
    out.textContent = "无法启动 Python 环境：" + ((err && err.message) || err) +
      "\n\n可能是网络问题（Pyodide 要从 CDN 下载）。也可以把代码复制到电脑的 python3 里运行。";
  }finally{
    btn.disabled = false; btn.textContent = "▶ 运行";
  }
}

  const txt = $("#aiInput").value.trim();
  if(!txt) return;
  $("#aiInput").value = "";
  aiBubble("user", txt);
  aiRun(txt, {displayUser:false});
};
$("#aiInput").onkeydown = e=>{
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("#aiSend").click(); }
};

/* 设置弹窗 */
$("#settingsMask").onclick = e=>{ if(e.target.id === "settingsMask") $("#settingsMask").classList.remove("show"); };
$("#saveAI").onclick = ()=>{
  ai.key = $("#keyInput").value.trim();
  ai.model = $("#modelSel").value;
  ai.autoAsk = $("#autoAsk").checked;
  saveAISettings();
  $("#settingsMask").classList.remove("show");
  toast(ai.key ? "AI 已配置" : "已清空 Key");
  if($("#app").children.length && !sess) renderHome();
};
$("#testAI").onclick = async ()=>{
  const btn = $("#testAI"), msg = $("#aiTestMsg");
  const oldKey = ai.key, oldModel = ai.model;
  ai.key = $("#keyInput").value.trim();
  ai.model = $("#modelSel").value;
  if(!ai.key){ msg.textContent = "先填写 API Key"; return; }
  btn.disabled = true; msg.textContent = "正在测试…";
  try{
    const t = await aiChatOnce("只回复两个字：你好");
    msg.style.color = "var(--good)";
    msg.textContent = "连接成功：" + t;
  }catch(err){
    msg.style.color = "var(--bad)";
    msg.textContent = err.message;
  }finally{
    btn.disabled = false;
    ai.key = oldKey; ai.model = oldModel;
  }
};

/* ================= 使用说明 ================= */
const GUIDE_KEY = "pyquiz.guide.v1";
let guideStep = 0;
const GUIDE_SLIDES = [

  },
  {
    icon: "book",
    title: "怎么开始",
    html: "<p>首页选一种方式：</p>" +
      "<ul><li><b>按套练习</b>：按原卷顺序刷，可只刷某一种题型</li><li><b>随机练习</b>：碎片时间抽 10 / 20 / 50 题，可按题型筛</li><li><b>错题本</b>：答错的自动进，连续答对 2 次移出</li></ul>" +
      "<p>答题：A–D 选择，Enter 提交，再按 Enter 下一题。</p>"
  },
  {
    icon: "bot",
    title: "AI 助教（可选）",
    html: "<p>点右上角 <b>AI</b>，填入自己的 DeepSeek API Key（只保存在这台设备的浏览器里）。</p>" +

  },
  {
    icon: IS_MOBILE ? "home" : "terminal",
    title: IS_MOBILE ? "手机上的用法" : "电脑上还能写代码",
    html: IS_MOBILE
      ? "<p>手机上保留：刷题、错题本、模拟考、AI 讲解。</p>" +
        "<ul><li>代码练习（运行 Python）已隐藏，完整版请用电脑打开</li><li>可以把页面「添加到主屏幕」，像 App 一样启动</li></ul>"
      : "<p>首页「代码练习」是一个迷你 IDE：</p>" +
        "<ul><li>多文件、行号、语法高亮、代码补全</li><li>直接运行 Python，支持 numpy / pandas / matplotlib</li><li>选中代码让 AI 讲解，报错让 AI 解释</li></ul>"
  }
];
function renderGuide(){
  const s = GUIDE_SLIDES[guideStep];
  $("#guideDots").innerHTML = GUIDE_SLIDES.map((_, i)=>`<i class="${i === guideStep ? "on" : ""}"></i>`).join("");
  $("#guideBody").innerHTML = `<span class="guide-ico">${ico(s.icon, 22)}</span><h3>${s.title}</h3>${s.html}`;
  $("#guideNext").textContent = guideStep === GUIDE_SLIDES.length - 1 ? "开始刷题" : "下一步";
  $("#guideSkip").textContent = guideStep === 0 ? "跳过" : "上一步";
}
function showGuide(){
  guideStep = 0;
  renderGuide();
  $("#guideMask").classList.add("show");
}
function closeGuide(){
  $("#guideMask").classList.remove("show");
  try{ localStorage.setItem(GUIDE_KEY, "1"); }catch(e){}
}
$("#guideSkip").onclick = ()=>{
  if(guideStep > 0){ guideStep--; renderGuide(); }
  else closeGuide();
};
$("#guideNext").onclick = ()=>{
  if(guideStep < GUIDE_SLIDES.length - 1){ guideStep++; renderGuide(); }
  else closeGuide();
};
$("#guideMask").onclick = e=>{ if(e.target.id === "guideMask") closeGuide(); };

/* ================= 键盘 ================= */
document.addEventListener("keydown", e=>{
  if(!sess) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea"){
    return;
  }
  if(e.key === "Escape"){ $("#btnBack") && $("#btnBack").click(); return; }
  if($("#btnNext") && (e.key === "Enter" || e.key.toLowerCase() === "n")){
    e.preventDefault(); $("#btnNext").click(); return;
  }
  if($("#btnSubmit") && e.key === "Enter"){
    e.preventDefault(); $("#btnSubmit").click(); return;
  }
  const opts = $("#options");
  if(opts && /^[a-dA-D]$/.test(e.key)){
    const btn = opts.querySelector(`.opt[data-k="${e.key.toUpperCase()}"]`);
    if(btn && !btn.disabled) btn.click();
  }
});

/* ================= 启动 ================= */
renderHome();
try{ if(!localStorage.getItem(GUIDE_KEY)) showGuide(); }catch(e){}
</script>
