<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d8bff'/%3E%3Cstop offset='1' stop-color='%23a06bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-size='26' font-family='-apple-system,BlinkMacSystemFont,sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EBW%3C/text%3E%3C/svg%3E">
<title>BW的Python家园</title>
<style>
  :root{
    --bg:#0a0c11; --panel:rgba(26,30,39,.58); --panel2:rgba(255,255,255,.055);
    --text:#eef1f7; --muted:#a6afbf;
    --line:rgba(255,255,255,.09); --glass-border:rgba(255,255,255,.10);
    --accent:#7d97ff; --accent-soft:rgba(125,151,255,.16);
    --accent-strong:#4f6ee0; --accent-strong-hover:#4360d0;
    --focus:#a9bcff;
    --good:#3ddc97; --good-soft:rgba(61,220,151,.12);
    --bad:#ff6b6b; --bad-soft:rgba(255,107,107,.12);
    --warn:#ffb84d;
    --radius:18px;
    --ease:180ms ease;
    --shadow:0 10px 34px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(55% 45% at 12% 0%, rgba(91,110,224,.24), transparent 62%),
      radial-gradient(45% 40% at 100% 8%, rgba(160,107,255,.18), transparent 68%),
      radial-gradient(50% 45% at 72% 100%, rgba(61,220,151,.10), transparent 68%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:820px;margin:0 auto;padding:22px 18px 60px}
  button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
  h1,h2,h3{margin:0;font-weight:650;letter-spacing:.2px}
  .muted{color:var(--muted)}
  .small{font-size:13px}

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#6d8bff,#9a6bff 62%,#c07bff);
    display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;flex:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px rgba(110,130,255,.3)}
  .brand h1{font-size:18px}
  .brand .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
  .iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;
    transition:border-color var(--ease),background var(--ease);inline-size:auto;display:inline-flex;align-items:center;gap:6px}
  .iconbtn:hover{border-color:#3b4560;background:var(--panel2)}
  .ico{flex:none;display:inline-block;vertical-align:-3px}
  .card h2 .ico{color:var(--accent)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5d6678;margin-right:6px;vertical-align:middle}
  .dot.on{background:var(--good);box-shadow:0 0 8px rgba(61,220,151,.6)}

  /* ---------- stat tiles ---------- */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 15px;
    -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .tile .k{font-size:12px;color:var(--muted)}
  .tile .v{font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.2px}
  .tile .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}

  /* ---------- cards ---------- */
  .card{background:var(--panel);border:1px solid var(--glass-border);border-radius:var(--radius);padding:18px;margin-bottom:12px;
    -webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05);
    transition:border-color var(--ease),background var(--ease)}
  .card:hover{border-color:rgba(255,255,255,.16)}
  .card h2{font-size:15.5px;display:flex;align-items:center;gap:9px;margin-bottom:4px;letter-spacing:.1px}
  .card .desc{font-size:13px;color:var(--muted);margin-bottom:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  select,input[type=number],input[type=password],input[type=text]{
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);
    padding:9px 11px;font:inherit;font-size:14px;outline:none;min-width:0
  }
  select:focus,input:focus,textarea:focus{border-color:var(--accent)}
  .btn{background:var(--accent-strong);border:1px solid transparent;color:#fff;border-radius:10px;
    padding:10px 16px;font-weight:600;font-size:14.5px;min-height:40px;
    transition:background var(--ease),border-color var(--ease),color var(--ease)}
  .btn:hover{background:var(--accent-strong-hover)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:var(--panel2);border-color:var(--line);color:var(--text);font-weight:500}
  .btn.ghost:hover{border-color:#3b4560;background:var(--panel2)}
  .btn.ai{background:var(--panel2);border:1px solid rgba(108,140,255,.55);color:#d3dcff}
  .btn.ai:hover{background:var(--accent-soft);border-color:var(--accent)}
  .btn.wide{width:100%}
  .chips{display:flex;gap:4px;flex-wrap:wrap;background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:14px;padding:4px}
  .chip{background:transparent;border:none;border-radius:10px;padding:8px 14px;font-size:13.5px;color:var(--muted)}
  .chip:hover{color:var(--text);background:rgba(255,255,255,.06)}
  .chip.on{background:rgba(255,255,255,.14);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}

  /* ---------- quiz ---------- */
  .quizbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .quizbar .meta{font-size:13px;color:var(--muted);text-align:center;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:650;font-size:14px;color:var(--warn);
    background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.3);border-radius:9px;padding:4px 10px}
  .timer.ok{color:var(--text);background:var(--panel2);border-color:var(--line)}

  .qcard{background:var(--panel);border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px;
    -webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05)}
  .qtag{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .badge{font-size:11.5px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);
    border-radius:999px;padding:2px 9px}
  .badge.type{color:#c9d3ff;background:var(--accent-soft);border-color:rgba(108,140,255,.35)}
  .stem{white-space:pre-wrap;word-break:break-word;font-size:15.5px;line-height:1.75}
  .body{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;
    padding:12px;margin-top:12px;color:#d3daea;overflow-x:auto}
  .options{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
    background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;
    font-size:14.5px;line-height:1.55;transition:border-color .12s,background .12s}
  .opt:hover{border-color:#3b4560}
  .opt .letter{flex:none;width:22px;height:22px;border-radius:6px;background:#2a3040;
    display:grid;place-items:center;font-size:12.5px;font-weight:700;color:#c9d3ff;margin-top:1px}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt.sel .letter{background:var(--accent-strong);color:#fff}
  .opt.right{border-color:var(--good);background:var(--good-soft)}
  .opt.right .letter{background:var(--good);color:#06281a}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt.wrong .letter{background:var(--bad);color:#2b0808}
  .opt[disabled]{cursor:default}

  .textans{width:100%;margin-top:14px;background:var(--panel2);border:1px solid var(--line);
    border-radius:11px;color:var(--text);padding:11px 13px;font:inherit;font-size:14.5px;outline:none}
  textarea.textans{min-height:140px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;line-height:1.6;tab-size:4}

  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .actions .btn{flex:1;min-width:120px}

  .feedback{margin-top:16px;border-radius:12px;padding:13px 15px;border:1px solid var(--line);background:var(--panel2)}
  .feedback.good{border-color:rgba(61,220,151,.45);background:var(--good-soft)}
  .feedback.bad{border-color:rgba(255,107,107,.45);background:var(--bad-soft)}
  .feedback .verdict{font-weight:700;font-size:14.5px;margin-bottom:6px}
  .feedback.good .verdict{color:var(--good)}
  .feedback.bad .verdict{color:var(--bad)}
  .answer-ref{white-space:pre-wrap;word-break:break-word;font-size:14px;
    background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:8px}
  .explain{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7;
    margin-top:10px;color:#cfd6e6}
  .explain h4{font-size:13px;color:var(--muted);margin:0 0 4px;font-weight:600}

  /* ---------- result ---------- */
  .big{font-size:44px;font-weight:800;letter-spacing:-1px}
  .big small{font-size:16px;font-weight:500;color:var(--muted);letter-spacing:0}
  .resultgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
  .reviewitem{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px}
  .reviewitem .s{white-space:pre-wrap;font-size:13.5px;color:#d6dbe8;max-height:150px;overflow:auto}

  /* ---------- stats ---------- */
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:500;font-size:12px}
  .bar{height:6px;border-radius:3px;background:#2a3040;overflow:hidden;min-width:60px}
  .bar>i{display:block;height:100%;background:var(--accent)}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2b3245;color:#fff;
    padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:120}
  .toast.show{opacity:1}

  /* ---------- AI drawer ---------- */
  .ai-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
  .ai-mask.show{opacity:1;pointer-events:auto}
  .ai-drawer{position:fixed;top:0;right:0;height:100dvh;width:min(460px,100vw);
    background:rgba(16,19,26,.84);border-left:1px solid var(--glass-border);z-index:90;
    -webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);
    box-shadow:-20px 0 60px rgba(0,0,0,.45);
    display:flex;flex-direction:column;transform:translateX(102%);transition:transform .22s ease}
  .ai-drawer.show{transform:none}
  .ai-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
  .ai-title{font-weight:650;font-size:15px}
  .ai-sub{font-size:12px;color:var(--muted);margin-top:1px}
  .ai-ctx{padding:9px 16px;border-bottom:1px solid var(--line);font-size:12.5px;flex:none}
  .ai-ctx summary{cursor:pointer;color:var(--muted);list-style:none;user-select:none}
  .ai-ctx summary::-webkit-details-marker{display:none}
  .ai-ctx summary:before{content:"▸ ";color:var(--accent)}
  .ai-ctx details[open] summary:before{content:"▾ "}
  .ai-ctx-body{margin-top:8px;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;
    background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;
    font-size:12.5px;line-height:1.55;color:#cfd6e6}
  .ai-head .iconbtn{padding:6px 10px}
  .ai-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .ai-msg{max-width:100%;border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
  .ai-msg.assistant{background:var(--panel2);border:1px solid var(--line)}
  .ai-msg.user{background:var(--accent-soft);border:1px solid rgba(108,140,255,.4);align-self:flex-end;max-width:88%}
  .ai-msg.err{background:var(--bad-soft);border-color:rgba(255,107,107,.45);color:#ffb3b3}
  .ai-msg .md-code{background:rgba(0,0,0,.34);border:1px solid var(--line);border-radius:11px;padding:10px 12px;
    margin:8px 0;overflow-x:auto;white-space:pre;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.55}
  .ai-msg .md-inline{background:rgba(0,0,0,.34);border:1px solid var(--line);border-radius:6px;padding:1px 5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  .ai-msg .md-text{white-space:pre-wrap}
  .ai-foot{flex:none;padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end;background:rgba(16,19,26,.72)}
  .ai-foot textarea{flex:1;min-height:42px;max-height:140px;resize:none;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font:inherit;font-size:14px;outline:none}
  .ai-foot .btn{padding:10px 14px}
  .typing{display:inline-block;color:var(--muted)}

  /* ---------- selection popup ---------- */
  .selpop{position:fixed;z-index:95;transform:translate(-50%,-100%);
    background:#2b3245;border:1px solid #3b4560;border-radius:9px;padding:8px 13px;font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,.45);display:none;align-items:center;gap:6px;white-space:nowrap;
    transition:background var(--ease)}
  .selpop.show{display:flex}
  .selpop:hover{background:#38405a}

  /* ---------- settings modal ---------- */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:100;padding:18px}
  .modal-mask.show{display:grid}
  .modal{background:var(--panel);border:1px solid var(--glass-border);border-radius:20px;padding:20px;width:min(460px,100%);max-width:calc(100vw - 36px);max-height:90vh;overflow:auto;
    -webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.06)}
  .modal h3{font-size:16px;margin-bottom:4px}
  .modal .field{margin-top:14px}
  .modal label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .modal input,.modal select{width:100%}
  .modal .row{margin-top:18px}
  .modal .row .btn{flex:1}

  /* ---------- 使用说明 ---------- */
  .guide h3{font-size:18px;margin-bottom:10px}
  .guide-ico{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;margin-bottom:12px}
  .guide p{margin:6px 0;color:#cfd6e6;font-size:14px;line-height:1.7}
  .guide ul{margin:8px 0 0;padding-left:20px;color:#cfd6e6;font-size:14px;line-height:1.85}
  .guide b{color:var(--text)}
  .guide-dots{display:flex;gap:6px;margin-bottom:16px}
  .guide-dots i{width:7px;height:7px;border-radius:50%;background:#2a3040;display:block;transition:width .2s}
  .guide-dots i.on{background:var(--accent);width:20px;border-radius:4px}

  /* ---------- mini IDE ---------- */
  .ed-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .ed-bar select{max-width:210px}
  .ed-bar .iconbtn{padding:7px 10px;font-size:12.5px}
  .ed-status{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}
  .CodeMirror{height:56vh;min-height:320px;max-height:620px;border:1px solid var(--line);border-radius:12px;
    font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  #app .CodeMirror.cm-s-material-darker{background:rgba(10,12,16,.76)}
  #app .cm-s-material-darker .CodeMirror-gutters{background:rgba(0,0,0,.32);border-right:1px solid var(--line)}
  #app .cm-s-material-darker .CodeMirror-linenumber{color:#4d5566}
  .CodeMirror-selected{background:rgba(108,140,255,.25) !important}
  .CodeMirror-cursor{border-left-color:#e8eaf0}
  .CodeMirror-hints{background:#1b2029;border:1px solid #2a3040;border-radius:9px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);padding:4px;z-index:110;
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#e8eaf0}
  .CodeMirror-hint{border-radius:6px;padding:4px 10px;color:#cfd6e6}
  li.CodeMirror-hint-active{background:#6c8cff;color:#fff}

  .btn:active, .iconbtn:active, .opt:active, .chip:active{transform:scale(.985)}
  .btn, .iconbtn, .opt, .chip{transition:transform var(--ease),background var(--ease),border-color var(--ease),color var(--ease)}
  @media (hover:none){ .card:hover{border-color:var(--glass-border)} }

  .footer-note{text-align:center;color:#8b93a5;font-size:12px;margin-top:26px}
  /* ---------- 可访问性 ---------- */
  button:focus-visible, summary:focus-visible, a:focus-visible, .opt:focus-visible, .chip:focus-visible{
    outline:2px solid var(--focus); outline-offset:2px;
  }
  select:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--focus); outline-offset:1px;
  }
  @media (pointer:coarse){
    .btn{min-height:46px}
    .iconbtn{min-height:44px;min-width:44px;justify-content:center}
    .opt{min-height:52px}
    .chip{min-height:44px;display:inline-flex;align-items:center}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
      transition-duration:.01ms !important;scroll-behavior:auto !important}
  }

  @media (max-width:520px){
    .tiles{grid-template-columns:repeat(3,1fr);gap:8px}
    .tile{padding:10px}
    .tile .v{font-size:18px}
    .wrap{padding:16px 13px 48px}
    .actions .btn{min-width:0}
    .ai-drawer{width:100vw;border-left:none}
    .top .row{margin-left:auto}
  }
  @media (max-width:420px){
    .brand h1{font-size:16px}
    .brand .sub{display:none}
    .iconbtn{padding:7px 9px;font-size:12.5px}
    .logo{width:34px;height:34px;font-size:15px}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="selpop" id="selPop"></div>

<div class="ai-mask" id="aiMask"></div>
<aside class="ai-drawer" id="aiDrawer" aria-hidden="true">
  <div class="ai-head">
    <div>
      <div class="ai-title" id="aiTitle">AI 助教</div>
      <div class="ai-sub" id="aiSub">DeepSeek</div>
    </div>
    <div class="row" style="gap:6px">
      <button class="iconbtn" id="aiSettingsBtn" title="AI 设置" aria-label="AI 设置"></button>
      <button class="iconbtn" id="aiClose" title="关闭" aria-label="关闭 AI 面板"></button>
    </div>
  </div>
  <div class="ai-ctx" id="aiCtx" hidden>
    <details>
      <summary id="aiCtxLabel">已带入当前题目</summary>
      <div class="ai-ctx-body" id="aiCtxBody"></div>
    </details>
  </div>
  <div class="ai-body" id="aiBody"></div>
  <div class="ai-foot">
    <textarea id="aiInput" rows="1" placeholder="继续追问…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button class="btn" id="aiSend">发送</button>
  </div>
</aside>

    "section": "五、程序设计题",
    "type": "design",
    "number": 5,
    "stem": "实现一个自定义迭代器类 EvenNumbers ，要求：\n• 接收起始值和结束值\n• 迭代返回范围内的所有偶数\n• 实现 __iter__() 和 __next__() 方法\n• 支持 for 循环遍历\n• 演示使用该迭代器",
    "title": "迭代器实现",
    "answer": "class EvenNumbers:\n    def __init__(self, start, end):\n        self.start = start if start % 2 == 0 else start + 1\n        self.end = end\n        self.current = self.start\n    def __iter__(self):\n        return self\n    def __next__(self):\n        if self.current > self.end:\n            raise StopIteration\n        result = self.current\n        self.current += 2\n        return result\neven_nums = EvenNumbers(1, 10)\nprint(\"1到10之间的偶数：\")\nfor num in even_nums:\n    print(num, end=' ')\nprint()\neven_nums2 = EvenNumbers(0, 20)\nprint(\"\\n0到20之间的偶数：\")\nprint(list(even_nums2))\n程序设计题详细参考答案\n题目1：学生成绩管理系统（完整实现）\n\"\"\"\n学生成绩管理系统\n功能：添加学生、查询成绩、计算统计信息、生成报告\n\"\"\"\nclass Student:\n    \"\"\"学生类 - 存储单个学生的信息\"\"\"\n    def __init__(self, student_id, name, scores):\n        \"\"\"\n        初始化学生对象\n        :param student_id: 学号\n        :param name: 姓名\n        :param scores: 成绩字典，如 {'语文': 90, '数学': 85}\n        \"\"\"\n        self.student_id = student_id\n        self.name = name\n        self.scores = scores\n    def average_score(self):\n        \"\"\"计算平均分\"\"\"\n        if not self.scores:\n            return 0\n        return sum(self.scores.values()) / len(self.scores)\n    def total_score(self):\n        \"\"\"计算总分\"\"\"\n        return sum(self.scores.values())\n    def __str__(self):\n        \"\"\"字符串表示\"\"\"\n        avg = self.average_score()\n        return f\"学号: {self.student_id}, 姓名: {self.name}, 平均分: {avg:.2f}\"\n    def __repr__(self):\n        return f\"Student({self.student_id}, {self.name}, {self.scores})\"\nclass GradeManager:\n\"\"\"成绩管理类 - 管理所有学生\"\"\"\ndef __init__(self):\n    \"\"\"初始化管理器\"\"\"\n    self.students = {}\n# 使用字典存储，key为学号\ndef add_student(self, student):\n    \"\"\"\n    添加学生\n    :param student: Student对象\n    \"\"\"\n    if student.student_id in self.students:\n        print(f\"警告: 学号{student.student_id} 已存在，将覆盖原数据\")\n    self.students[student.student_id] = student\n    print(f\"成功添加学生: {student.name}\")\ndef find_student(self, student_id):\n    \"\"\"\n    查找学生\n    :param student_id: 学号\n    :return: Student对象或None\n    \"\"\"\n    return self.students.get(student_id)\ndef get_subject_average(self, subject):\n    \"\"\"\n    计算某科目的平均分\n    :param subject: 科目名称\n    :return: 平均分\n    \"\"\"\n    scores = [s.scores.get(subject, 0) for s in self.students.values()\n            if subject in s.scores]\n    if not scores:\n        return 0\n    return sum(scores) / len(scores)\ndef get_top_students(self, n=3):\n    \"\"\"\n    获取成绩前N名的学生\n    :param n: 返回前几名\n        :return: 学生列表\n        \"\"\"\n        sorted_students = sorted(self.students.values(),\n                key=lambda s: s.average_score(),\n                reverse=True)\n        return sorted_students[:n]\n    def generate_report(self):\n        \"\"\"生成成绩报告\"\"\"\n        print(\"\\n\" + \"=\"*50)\n        print(\"成绩统计报告\".center(50))\n        print(\"=\"*50)\n        print(f\"\\n总学生数: {len(self.students)}\")\n        # 各科平均分\n        if self.students:\n            all_subjects = set()\n            for student in self.students.values():\n                all_subjects.update(student.scores.keys())\n            print(\"\\n各科平均分:\")\n            for subject in sorted(all_subjects):\n                avg = self.get_subject_average(subject)\n                print(f\"\n                {subject}: {avg:.2f}\")\n        # 前三名学生\n        print(\"\\n成绩前三名:\")\n        for i, student in enumerate(self.get_top_students(3), 1):\n            print(f\"\n                {i}. {student}\")\n        print(\"=\"*50 + \"\\n\")\n# 使用示例\nif __name__ == \"__main__\":\n    # 创建管理器\n    manager = GradeManager()\n    # 添加学生\ns1 = Student(\"001\", \"张三\", {\"语文\": 90, \"数学\": 85, \"英语\": 88})\ns2 = Student(\"002\", \"李四\", {\"语文\": 85, \"数学\": 92, \"英语\": 90})\ns3 = Student(\"003\", \"王五\", {\"语文\": 88, \"数学\": 87, \"英语\": 85})\ns4 = Student(\"004\", \"赵六\", {\"语文\": 92, \"数学\": 88, \"英语\": 91})\nmanager.add_student(s1)\nmanager.add_student(s2)\nmanager.add_student(s3)\nmanager.add_student(s4)\n# 查询学生\nstudent = manager.find_student(\"001\")\nif student:\n    print(f\"\\n查询结果: {student}\")\n# 生成报告\nmanager.generate_report()\n设计要点：\n1. 面向对象设计\n面向对象设计：Student类负责单个学生数据，GradeManager负责整体管理\n2. 数据结构选择\n数据结构选择：使用字典存储学生，便于快速查找\n3. 错误处理\n错误处理：检查学号是否重复，处理空数据情况\n4. 代码复用\n代码复用：average_score等方法可被多处调用\n5. 可扩展性\n可扩展性：易于添加新功能（如删除学生、修改成绩等）\n题目2：装饰器实现（完整实现）\n\"\"\"\n装饰器实现：日志记录、性能测试、缓存\n\"\"\"\nimport time\nimport functools\nfrom datetime import datetime\ndef log_function_call(func):\n    \"\"\"\n    日志装饰器 - 记录函数调用信息\n    功能：记录函数名、参数、返回值、调用时间\n    \"\"\"\n    @functools.wraps(func)\n    def wrapper(*args, **kwargs):\n        # 记录调用时间\n        call_time = datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        # 记录参数\n        args_str = ', '.join(repr(arg) for arg in args)\n        kwargs_str = ', '.join(f\"{k}={v!r}\" for k, v in kwargs.items())\n        all_args = ', '.join(filter(None, [args_str, kwargs_str]))\n        print(f\"[{call_time}] 调用函数: {func.__name__}({all_args})\")\n        # 执行函数\n        try:\n            result = func(*args, **kwargs)\n            print(f\"[{call_time}] 返回值: {result!r}\")\n            return result\n        except Exception as e:\n            print(f\"[{call_time}] 异常: {type(e).__name__}: {e}\")\n            raise\n    return wrapper\ndef timer(func):\n    \"\"\"\n    性能测试装饰器 - 测量函数执行时间\n    \"\"\"\n    @functools.wraps(func)\n    def wrapper(*args, **kwargs):\n        start_time = time.time()\n        result = func(*args, **kwargs)\n        end_time = time.time()\n        elapsed_time = end_time - start_time\n        print(f\"函数{func.__name__} 执行时间: {elapsed_time:.6f} 秒\")\n        return result\n    return wrapper\ndef cache(func):\n    \"\"\"\n    缓存装饰器 - 缓存函数结果\n    使用字典存储已计算的结果，避免重复计算\n    \"\"\"\n    cached_results = {}\n    @functools.wraps(func)\n    def wrapper(*args, **kwargs):\n        # 创建缓存键（注意：kwargs需要转换为可哈希类型）\n        cache_key = (args, tuple(sorted(kwargs.items())))\n        if cache_key in cached_results:\n            print(f\"缓存命中: {func.__name__}{args}\")\n            return cached_results[cache_key]\n        # 计算结果并缓存\n        result = func(*args, **kwargs)\n        cached_results[cache_key] = result\n        print(f\"缓存存储: {func.__name__}{args} = {result}\")\n        return result\n    # 添加缓存管理方法\n    wrapper.cache_info = lambda: {\n        'size': len(cached_results),\n        'hits': sum(1 for _ in cached_results)\n    }\n    wrapper.cache_clear = lambda: cached_results.clear()\n    return wrapper\n# 组合使用多个装饰器\n@log_function_call\n@timer\n@cache\ndef fibonacci(n):\n    \"\"\"计算斐波那契数列第n项\"\"\"\n    if n <= 1:\n        return n\n    return fibonacci(n-1) + fibonacci(n-2)\n@log_function_call\ndef add(a, b):\n    \"\"\"加法函数\"\"\"\n    return a + b\n# 使用示例\nif __name__ == \"__main__\":\n    print(\"=\" * 60)\n    print(\"测试日志装饰器\")\n    print(\"=\" * 60)\n    result = add(3, 5)\n    print(\"\\n\" + \"=\" * 60)\n    print(\"测试缓存装饰器\")\n    print(\"=\" * 60)\n    fibonacci(5)\n                # 第二次调用会使用缓存\nprint(\"\\n\" + \"=\" * 60)\nprint(\"测试性能装饰器\")\nprint(\"=\" * 60)\n@timer\ndef slow_function():\n    time.sleep(0.1)\n    return \"完成\"\nslow_function()\n设计要点：\n1. functools.wraps：保留原函数的元数据（名称、文档等）\n2. 闭包\n闭包：装饰器内部函数可以访问外部变量（如cached_results）\n3. 可组合性\n可组合性：多个装饰器可以叠加使用\n4. 缓存键设计\n缓存键设计：将args和kwargs转换为可哈希的元组\n5. 扩展性\n扩展性：为cache装饰器添加cache_info和cache_clear方法\n题目3：生成器实现（完整实现）\n\"\"\"\n生成器实现：文件读取、数据过滤、无限序列\n\"\"\"\nfrom pathlib import Path\nimport itertools\ndef read_large_file(filepath, chunk_size=1024):\n    \"\"\"\n    生成器：逐块读取大文件\n    :param filepath: 文件路径\n    :param chunk_size: 每次读取的字节数\n    :yield: 文件内容块\n    \"\"\"\n    try:\n        with open(filepath, 'r', encoding='utf-8') as f:\n            while True:\n                chunk = f.read(chunk_size)\n                if not chunk:\n                break\n                yield chunk\n    except FileNotFoundError:\n        print(f\"文件不存在: {filepath}\")\n    except Exception as e:\n        print(f\"读取文件出错: {e}\")\ndef read_lines(filepath):\n    \"\"\"\n    生成器：逐行读取文件\n    :param filepath: 文件路径\n    :yield: 文件的每一行\n    \"\"\"\n    try:\n        with open(filepath, 'r', encoding='utf-8') as f:\n            for line in f:\n                yield line.rstrip('\\n')\n    except Exception as e:\n        print(f\"读取文件出错: {e}\")\ndef filter_data(data_iter, condition):\n    \"\"\"\n    生成器：过滤数据\n    :param data_iter: 数据迭代器\n    :param condition: 过滤条件函数\n    :yield: 满足条件的数据\n    \"\"\"\n    for item in data_iter:\n        if condition(item):\n            yield item\ndef fibonacci_generator():\n    \"\"\"\n    生成器：无限斐波那契数列\n    :yield: 斐波那契数\n    \"\"\"\n    a, b = 0, 1\n    while True:\n        yield a\n        a, b = b, a + b\ndef prime_generator():\n    \"\"\"\n    生成器：无限素数序列\n    :yield: 素数\n    \"\"\"\n    def is_prime(n):\n        if n < 2:\n            return False\n        for i in range(2, int(n ** 0.5) + 1):\n            if n % i == 0:\n                return False\n        return True\n    n = 2\n    while True:\n        if is_prime(n):\n            yield n\n        n += 1\ndef batch_generator(iterable, batch_size):\n    \"\"\"\n    生成器：将数据分批\n    :param iterable: 可迭代对象\n    :param batch_size: 批次大小\n    :yield: 数据批次\n    \"\"\"\n    iterator = iter(iterable)\n    while True:\n        batch = list(itertools.islice(iterator, batch_size))\n        if not batch:\n            break\n        yield batch\n# 使用示例\nif __name__ == \"__main__\":\n    print(\"=\" * 60)\n    print(\"示例1: 斐波那契数列生成器\")\n    print(\"=\" * 60)\n    fib = fibonacci_generator()\n    print(\"前10个斐波那契数:\")\n    for i, num in enumerate(fib):\n        if i >= 10:\n            break\n        print(num, end=' ')\n    print(\"\\n\")\n    print(\"=\" * 60)\n    print(\"示例2: 素数生成器\")\n    print(\"=\" * 60)\n    primes = prime_generator()\n    print(\"前10个素数:\")\n    for i, prime in enumerate(primes):\n    if i >= 10:\n        break\n    print(prime, end=' ')\nprint(\"\\n\")\nprint(\"=\" * 60)\nprint(\"示例3: 数据过滤\")\nprint(\"=\" * 60)\nnumbers = range(1, 21)\neven_numbers = filter_data(numbers, lambda x: x % 2 == 0)\nprint(\"1-20的偶数:\")\nprint(list(even_numbers))\nprint(\"\\n\" + \"=\" * 60)\nprint(\"示例4: 批次生成器\")\nprint(\"=\" * 60)\ndata = range(1, 11)\nbatches = batch_generator(data, 3)\nprint(\"将1-10分成批次(每批3个):\")\nfor i, batch in enumerate(batches, 1):\n    print(f\"批次{i}: {batch}\")\n# 文件操作示例（需要实际文件）\nprint(\"\\n\" + \"=\" * 60)\nprint(\"示例5: 文件读取生成器\")\nprint(\"=\" * 60)\n# 创建测试文件\ntest_file = Path(\"test_data.txt\")\ntest_file.write_text(\"第一行\\n第二行\\n第三行\\n第四行\\n第五行\\n\")\nprint(\"逐行读取文件:\")\nfor line in read_lines(test_file):\n    print(f\"\n            {line}\")\n# 清理测试文件\ntest_file.unlink()\n设计要点：\n1. 内存效率\n内存效率：生成器逐个产生数据，不需要一次性加载所有数据\n2. 惰性计算\n惰性计算：只在需要时才计算下一个值\n3. 无限序列\n无限序列：可以生成无限序列（如斐波那契、素数）\n4. 组合使用\n组合使用：生成器可以串联使用（如filter_data）\n5. 资源管理\n资源管理：使用with语句确保文件正确关闭\n题目4：Pandas数据分析（完整实现）\n\"\"\"\nPandas数据分析：数据清洗、统计分析、可视化\n\"\"\"\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom datetime import datetime, timedelta\n# 设置中文显示\nplt.rcParams['font.sans-serif'] = ['SimHei']\nplt.rcParams['axes.unicode_minus'] = False\nclass DataAnalyzer:\n    \"\"\"数据分析类\"\"\"\n    def __init__(self, data=None):\n        \"\"\"初始化分析器\"\"\"\n        self.df = data if data is not None else pd.DataFrame()\n    def load_data(self, filepath):\n        \"\"\"加载数据\"\"\"\n        try:\n            self.df = pd.read_csv(filepath)\n            print(f\"成功加载数据: {len(self.df)} 行\")\n            return self.df\n        except Exception as e:\n            print(f\"加载数据失败: {e}\")\n            return None\n    def clean_data(self):\n        \"\"\"数据清洗\"\"\"\n        print(\"\\n开始数据清洗...\")\n        original_size = len(self.df)\n        # 1. 删除完全重复的行\n        self.df.drop_duplicates(inplace=True)\n        print(f\"删除重复行: {original_size - len(self.df)} 行\")\n    # 2. 处理缺失值\n    missing_before = self.df.isnull().sum().sum()\n    # 数值列用中位数填充\n    numeric_cols = self.df.select_dtypes(include=[np.number]).columns\n    for col in numeric_cols:\n        self.df[col].fillna(self.df[col].median(), inplace=True)\n    # 分类列用众数填充\n    categorical_cols = self.df.select_dtypes(include=['object']).columns\n    for col in categorical_cols:\n        mode_value = self.df[col].mode()\n        if len(mode_value) > 0:\n            self.df[col].fillna(mode_value[0], inplace=True)\n    missing_after = self.df.isnull().sum().sum()\n    print(f\"处理缺失值: {missing_before - missing_after} 个\")\n    # 3. 删除异常值（使用IQR方法）\n    for col in numeric_cols:\n        Q1 = self.df[col].quantile(0.25)\n        Q3 = self.df[col].quantile(0.75)\n        IQR = Q3 - Q1\n        lower_bound = Q1 - 1.5 * IQR\n        upper_bound = Q3 + 1.5 * IQR\n        outliers = ((self.df[col] < lower_bound) |\n                (self.df[col] > upper_bound)).sum()\n        if outliers > 0:\n            print(f\"列{col} 发现{outliers} 个异常值\")\n            self.df = self.df[\n                (self.df[col] >= lower_bound) &\n                (self.df[col] <= upper_bound)\n            ]\n    print(f\"清洗完成，剩余{len(self.df)} 行\\n\")\n    return self.df\ndef basic_statistics(self):\n    \"\"\"基础统计分析\"\"\"\n    print(\"=\" * 60)\n    print(\"基础统计信息\")\n    print(\"=\" * 60)\n    print(self.df.describe())\n    print(\"\\n数据类型:\")\n    print(self.df.dtypes)\n    print(f\"\\n数据形状: {self.df.shape}\")\n    return self.df.describe()\ndef group_analysis(self, group_by, agg_col, agg_func='mean'):\n    \"\"\"分组分析\"\"\"\n    print(f\"\\n按{group_by} 分组，对{agg_col} 进行{agg_func} 统计:\")\n    result = self.df.groupby(group_by)[agg_col].agg(agg_func)\n    print(result)\n    return result\ndef visualize(self, save_path='analysis_report.png'):\n    \"\"\"数据可视化\"\"\"\n    numeric_cols = self.df.select_dtypes(include=[np.number]).columns\n    if len(numeric_cols) == 0:\n        print(\"没有数值列可以可视化\")\n        return\n    n_cols = min(len(numeric_cols), 4)\n    fig, axes = plt.subplots(2, 2, figsize=(12, 10))\n    axes = axes.flatten()\n    for i, col in enumerate(numeric_cols[:4]):\n        # 直方图\n        axes[i].hist(self.df[col].dropna(), bins=30, edgecolor='black')\n        axes[i].set_title(f'{col} 分布')\n        axes[i].set_xlabel(col)\n        axes[i].set_ylabel('频数')\n    plt.tight_layout()\n    plt.savefig(save_path)\n    print(f\"\\n可视化图表已保存: {save_path}\")\n    plt.close()\n# 使用示例\nif __name__ == \"__main__\":\n    # 创建示例数据\n    np.random.seed(42)\n    dates = pd.date_range('2024-01-01', periods=100, freq='D')\n    df = pd.DataFrame({\n        '日期': dates,\n        '销售额': np.random.normal(10000, 2000, 100),\n        '访客数': np.random.randint(100, 500, 100),\n        '转化率': np.random.uniform(0.01, 0.1, 100),\n        '地区': np.random.choice(['北京', '上海', '广州', '深圳'], 100)\n    })\n    # 添加一些缺失值和异常值\n    df.loc[np.random.choice(df.index, 5), '销售额'] = np.nan\n    df.loc[np.random.choice(df.index, 3), '销售额'] = 50000\n    # 异常值\n    # 创建分析器\n    analyzer = DataAnalyzer(df)\n    # 数据清洗\n    analyzer.clean_data()\n    # 基础统计\n    analyzer.basic_statistics()\n    # 分组分析\n    analyzer.group_analysis('地区', '销售额', 'mean')\n    analyzer.group_analysis('地区', '访客数', 'sum')\n    # 可视化\n    analyzer.visualize()\n    print(\"\\n分析完成！\")\n设计要点：\n1. 数据清洗流程\n数据清洗流程：去重→处理缺失值→删除异常值\n2. 统计方法\n统计方法：使用IQR方法检测异常值\n3. 分组聚合\n分组聚合：灵活的groupby操作\n4. 可视化\n可视化：使用matplotlib生成图表\n5. 面向对象\n面向对象：封装成类便于复用\n题目5：Pathlib文件操作（完整实现）\n\"\"\"\nPathlib文件操作：文件管理、目录遍历、批量处理\n\"\"\"\nfrom pathlib import Path\nimport shutil\nfrom datetime import datetime\nclass FileManager:\n    \"\"\"文件管理器类\"\"\"\n    def __init__(self, base_path='.'):\n        \"\"\"初始化文件管理器\"\"\"\n        self.base_path = Path(base_path)\n        if not self.base_path.exists():\n            self.base_path.mkdir(parents=True)\n    def create_directory_structure(self, structure):\n        \"\"\"\n        创建目录结构\n        :param structure: 目录结构字典\n        \"\"\"\n        for dir_name in structure:\n            dir_path = self.base_path / dir_name\n            dir_path.mkdir(parents=True, exist_ok=True)\n            print(f\"创建目录: {dir_path}\")\n    def find_files(self, pattern='*', recursive=True):\n        \"\"\"\n        查找文件\n        :param pattern: 文件模式（如 '*.txt'）\n        :param recursive: 是否递归查找\n        :return: 文件路径列表\n        \"\"\"\n        if recursive:\n            files = list(self.base_path.rglob(pattern))\n        else:\n            files = list(self.base_path.glob(pattern))\n    print(f\"找到{len(files)} 个匹配的文件\")\n    return files\ndef organize_by_extension(self, source_dir=None):\n    \"\"\"\n    按扩展名组织文件\n    将文件移动到以扩展名命名的子目录中\n    \"\"\"\n    source = Path(source_dir) if source_dir else self.base_path\n    for file_path in source.iterdir():\n        if file_path.is_file():\n            # 获取扩展名（去掉点号）\n            ext = file_path.suffix[1:] if file_path.suffix else 'no_extension'\n            # 创建目标目录\n            target_dir = source / ext\n            target_dir.mkdir(exist_ok=True)\n            # 移动文件\n            target_path = target_dir / file_path.name\n            shutil.move(str(file_path), str(target_path))\n            print(f\"移动: {file_path.name} -> {ext}/\")\ndef batch_rename(self, pattern, prefix='', suffix=''):\n    \"\"\"\n    批量重命名文件\n    :param pattern: 文件模式\n    :param prefix: 前缀\n    :param suffix: 后缀\n    \"\"\"\n    files = self.find_files(pattern, recursive=False)\n    for i, file_path in enumerate(files, 1):\n        new_name = f\"{prefix}{i:03d}{suffix}{file_path.suffix}\"\n        new_path = file_path.parent / new_name\n        file_path.rename(new_path)\n        print(f\"重命名: {file_path.name} -> {new_name}\")\ndef get_file_info(self, filepath):\n    \"\"\"\n    获取文件信息\n    :param filepath: 文件路径\n    :return: 文件信息字典\n    \"\"\"\n    path = Path(filepath)\n    if not path.exists():\n        return None\n    stat = path.stat()\n    info = {\n        '文件名': path.name,\n        '完整路径': str(path.absolute()),\n        '大小(字节)': stat.st_size,\n        '创建时间': datetime.fromtimestamp(stat.st_ctime),\n        '修改时间': datetime.fromtimestamp(stat.st_mtime),\n        '是否文件': path.is_file(),\n        '是否目录': path.is_dir(),\n        '扩展名': path.suffix\n    }\n    return info\ndef search_content(self, keyword, file_pattern='*.txt'):\n    \"\"\"\n    在文件中搜索关键词\n    :param keyword: 搜索关键词\n    :param file_pattern: 文件模式\n    :return: 包含关键词的文件列表\n    \"\"\"\n    results = []\n    files = self.find_files(file_pattern)\n    for file_path in files:\n        try:\n            content = file_path.read_text(encoding='utf-8')\n            if keyword in content:\n                results.append(file_path)\n                print(f\"找到: {file_path}\")\n            except Exception as e:\n                print(f\"读取文件失败{file_path}: {e}\")\n        return results\n    def backup_files(self, backup_dir='backup'):\n        \"\"\"\n        备份文件\n        :param backup_dir: 备份目录名\n        \"\"\"\n        backup_path = self.base_path / backup_dir\n        backup_path.mkdir(exist_ok=True)\n        timestamp = datetime.now().strftime('%Y%m%d_%H%M%S')\n        for file_path in self.base_path.iterdir():\n            if file_path.is_file():\n                backup_name = f\"{file_path.stem}_{timestamp}{file_path.suffix}\"\n                backup_file = backup_path / backup_name\n                shutil.copy2(str(file_path), str(backup_file))\n                print(f\"备份: {file_path.name} -> {backup_name}\")\n# 使用示例\nif __name__ == \"__main__\":\n    # 创建测试环境\n    test_dir = Path(\"test_file_manager\")\n    test_dir.mkdir(exist_ok=True)\n    # 创建文件管理器\n    fm = FileManager(test_dir)\n    print(\"=\" * 60)\n    print(\"示例1: 创建目录结构\")\n    print(\"=\" * 60)\n    structure = ['documents', 'images', 'videos', 'backup']\n    fm.create_directory_structure(structure)\n    print(\"\\n\" + \"=\" * 60)\nprint(\"示例2: 创建测试文件\")\nprint(\"=\" * 60)\n# 创建一些测试文件\n(test_dir / 'file1.txt').write_text('这是测试文件1')\n(test_dir / 'file2.txt').write_text('这是测试文件2，包含关键词Python')\n(test_dir / 'file3.md').write_text('# Markdown文件')\n(test_dir / 'image.jpg').touch()\nprint(\"\\n\" + \"=\" * 60)\nprint(\"示例3: 查找文件\")\nprint(\"=\" * 60)\ntxt_files = fm.find_files('*.txt', recursive=False)\nprint(\"\\n\" + \"=\" * 60)\nprint(\"示例4: 获取文件信息\")\nprint(\"=\" * 60)\nif txt_files:\n    info = fm.get_file_info(txt_files[0])\n    for key, value in info.items():\n        print(f\"{key}: {value}\")\nprint(\"\\n\" + \"=\" * 60)\nprint(\"示例5: 搜索内容\")\nprint(\"=\" * 60)\nfm.search_content('Python', '*.txt')\nprint(\"\\n\" + \"=\" * 60)\nprint(\"示例6: 备份文件\")\nprint(\"=\" * 60)\nfm.backup_files()\n# 清理测试环境\nprint(\"\\n清理测试环境...\")\nshutil.rmtree(test_dir)\nprint(\"完成！\")\n设计要点：\n1. Path对象\n    对象：使用pathlib.Path代替字符串路径操作\n2. 跨平台\n跨平台：Path自动处理不同操作系统的路径分隔符\n3. 链式操作\n链式操作：Path支持/操作符连接路径\n4. 异常处理\n异常处理：处理文件不存在、权限等问题\n5. 实用功能\n实用功能：文件组织、批量重命名、内容搜索、备份等\n评分说明：\n• 单选题：每题1分，共30分\n• 多选题：每题2分，选对但不全得1分，有错选不得分，共30分\n• 填空题：每空1分，共10分\n• 代码阅读题：每题3分，共15分\n• 程序设计题：5选3，每题5分，共15分\n• 总分：\n总分：100分",

    "stem": "实现以下高级函数功能：\n1. compose(*functions) ：函数组合装饰器\n• 将多个函数组合成一个\n• 从右到左执行\n2. retry(times, exceptions) ：重试装饰器\n• 函数失败时自动重试\n• 指定重试次数和捕获的异常\n3. curry(func) ：柯里化装饰器\n• 将多参数函数转换为单参数函数链\n演示这些装饰器的使用。",
    "title": "函数工具库",
    "answer": "from functools import wraps\nimport time\ndef compose(*functions):\n    def decorator(func):\n        @wraps(func)\n        def wrapper(*args, **kwargs):\n            result = func(*args, **kwargs)\n            for f in reversed(functions):\n                result = f(result)\n            return result\n        return wrapper\n    return decorator\ndef retry(times=3, exceptions=(Exception,)):\n    def decorator(func):\n        @wraps(func)\n        def wrapper(*args, **kwargs):\n            for attempt in range(times):\n                try:\n                return func(*args, **kwargs)\n                except exceptions as e:\n                if attempt == times - 1:\n                raise\n                print(f\"尝试{attempt + 1} 失败: {e}\")\n                time.sleep(1)\n        return wrapper\n    return decorator\ndef curry(func):\n    @wraps(func)\n    def wrapper(x):\n        def inner(y):\n            return func(x, y)\n        return inner\n    return wrapper\n# 使用示例\n@compose(lambda x: x * 2, lambda x: x + 10)\ndef base_value():\n    return 5\nprint(f\"组合函数结果: {base_value()}\")\n# (5 + 10) * 2 = 30\n@retry(times=3, exceptions=(ValueError,))\ndef unstable_function():\n    import random\n    if random.random() < 0.7:\n        raise ValueError(\"随机错误\")\n    return \"成功\"\ntry:\n    result = unstable_function()\n    print(f\"重试函数结果: {result}\")\nexcept ValueError:\n    print(\"所有重试都失败了\")\n@curry\ndef add(x, y):\n    return x + y\nadd_5 = add(5)\nprint(f\"柯里化结果: {add_5(3)}\")\n                # 8\n程序设计题详细参考答案\n题目1：图书管理系统（完整实现）\n\"\"\"\n图书管理系统\n功能：图书管理、借阅管理、统计查询\n使用面向对象设计和装饰器模式\n\"\"\"\nfrom datetime import datetime, timedelta\nfrom functools import wraps\nimport json\ndef log_operation(func):\n    \"\"\"日志装饰器 - 记录所有操作\"\"\"\n    @wraps(func)\n    def wrapper(self, *args, **kwargs):\n        operation = func.__name__\n        timestamp = datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n        result = func(self, *args, **kwargs)\n        print(f\"[{timestamp}] 操作: {operation}, 参数: {args}\")\n        return result\n    return wrapper\nclass Book:\n    \"\"\"图书类\"\"\"\n    def __init__(self, book_id, title, author, isbn, total_copies=1):\n        self.book_id = book_id\n        self.title = title\n        self.author = author\n        self.isbn = isbn\n        self.total_copies = total_copies\n        self.available_copies = total_copies\n        self.borrowed_by = []\n    # 借阅记录\n    def is_available(self):\n        \"\"\"检查是否有可借阅的副本\"\"\"\n        return self.available_copies > 0\n    def __str__(self):\n        return f\"《{self.title}》- {self.author} (可借: {self.available_copies}/{self.total\n    def __repr__(self):\n        return f\"Book({self.book_id}, {self.title}, {self.author})\"\nclass Member:\n    \"\"\"会员类\"\"\"\n    def __init__(self, member_id, name, max_books=3):\n        self.member_id = member_id\n        self.name = name\n        self.max_books = max_books\n        self.borrowed_books = []\n        # 当前借阅的图书\n        self.borrow_history = []\n    # 借阅历史\n    def can_borrow(self):\n        \"\"\"检查是否可以借书\"\"\"\n        return len(self.borrowed_books) < self.max_books\n    def __str__(self):\n        return f\"会员: {self.name} (已借: {len(self.borrowed_books)}/{self.max_books})\"\nclass BorrowRecord:\n    \"\"\"借阅记录类\"\"\"\n    def __init__(self, book, member, borrow_date=None):\n        self.book = book\n        self.member = member\n        self.borrow_date = borrow_date or datetime.now()\n        self.due_date = self.borrow_date + timedelta(days=30)\n        self.return_date = None\n    def is_overdue(self):\n        \"\"\"检查是否逾期\"\"\"\n        if self.return_date:\n            return False\n        return datetime.now() > self.due_date\n    def days_overdue(self):\n        \"\"\"计算逾期天数\"\"\"\n        if not self.is_overdue():\n            return 0\n        return (datetime.now() - self.due_date).days\n    def __str__(self):\n        status = \"已归还\" if self.return_date else (\"逾期\" if self.is_overdue() else \"借阅中\n        return f\"{self.member.name} 借阅 《{self.book.title}》 - {status}\"\nclass Library:\n    \"\"\"图书馆管理系统\"\"\"\n    def __init__(self, name):\n        self.name = name\n        self.books = {}\n        # book_id -> Book\n        self.members = {}\n        # member_id -> Member\n        self.borrow_records = []\n    @log_operation\n    def add_book(self, book):\n        \"\"\"添加图书\"\"\"\n        if book.book_id in self.books:\n            # 如果图书已存在，增加副本数\n            existing_book = self.books[book.book_id]\n            existing_book.total_copies += book.total_copies\n            existing_book.available_copies += book.total_copies\n            print(f\"增加《{book.title}》副本，现有{existing_book.total_copies} 本\")\n        else:\n            self.books[book.book_id] = book\n            print(f\"成功添加图书: {book}\")\n    @log_operation\n    def add_member(self, member):\n        \"\"\"添加会员\"\"\"\n        if member.member_id in self.members:\n            print(f\"会员{member.name} 已存在\")\n            return False\n    self.members[member.member_id] = member\n    print(f\"成功添加会员: {member}\")\n    return True\n@log_operation\ndef borrow_book(self, member_id, book_id):\n    \"\"\"借书\"\"\"\n    # 检查会员和图书是否存在\n    if member_id not in self.members:\n        print(\"会员不存在\")\n        return False\n    if book_id not in self.books:\n        print(\"图书不存在\")\n        return False\n    member = self.members[member_id]\n    book = self.books[book_id]\n    # 检查借阅条件\n    if not member.can_borrow():\n        print(f\"{member.name} 已达到借阅上限\")\n        return False\n    if not book.is_available():\n        print(f\"《{book.title}》暂无可借副本\")\n        return False\n    # 执行借阅\n    record = BorrowRecord(book, member)\n    self.borrow_records.append(record)\n    book.available_copies -= 1\n    book.borrowed_by.append(member_id)\n    member.borrowed_books.append(book_id)\n    member.borrow_history.append(record)\n    print(f\"借阅成功: {member.name} 借阅《{book.title}》\")\n    print(f\"应还日期: {record.due_date.strftime('%Y-%m-%d')}\")\n    return True\n@log_operation\ndef return_book(self, member_id, book_id):\n    \"\"\"还书\"\"\"\n    if member_id not in self.members or book_id not in self.books:\n        print(\"会员或图书不存在\")\n        return False\n    member = self.members[member_id]\n    book = self.books[book_id]\n    if book_id not in member.borrowed_books:\n        print(f\"{member.name} 未借阅《{book.title}》\")\n        return False\n    # 查找借阅记录\n    record = None\n    for r in reversed(self.borrow_records):\n        if r.member.member_id == member_id and r.book.book_id == book_id and not r.ret\n            record = r\n            break\n    if not record:\n        print(\"未找到借阅记录\")\n        return False\n    # 执行归还\n    record.return_date = datetime.now()\n    book.available_copies += 1\n    book.borrowed_by.remove(member_id)\n    member.borrowed_books.remove(book_id)\n    # 检查是否逾期\n    if record.is_overdue():\n        days = record.days_overdue()\n        fine = days * 0.5\n        # 每天罚款0.5元\n        print(f\"归还成功（逾期{days} 天，罚款{fine:.2f} 元）\")\n    else:\n        print(f\"归还成功: {member.name} 归还《{book.title}》\")\n    return True\ndef search_books(self, keyword):\n    \"\"\"搜索图书\"\"\"\n    results = []\n    keyword_lower = keyword.lower()\n    for book in self.books.values():\n        if (keyword_lower in book.title.lower() or\n            keyword_lower in book.author.lower() or\n            keyword_lower in book.isbn):\n            results.append(book)\n    return results\ndef get_overdue_books(self):\n    \"\"\"获取逾期图书列表\"\"\"\n    overdue = []\n    for record in self.borrow_records:\n        if record.is_overdue():\n            overdue.append(record)\n    return overdue\ndef generate_report(self):\n    \"\"\"生成统计报告\"\"\"\n    print(\"\\n\" + \"=\"*60)\n    print(f\"{self.name} - 统计报告\".center(60))\n    print(\"=\"*60)\n    print(f\"\\n图书总数: {len(self.books)} 种\")\n    total_copies = sum(book.total_copies for book in self.books.values())\n    available_copies = sum(book.available_copies for book in self.books.values())\n    print(f\"藏书总量: {total_copies} 本 (可借: {available_copies} 本)\")\n    print(f\"\\n会员总数: {len(self.members)} 人\")\n    active_members = sum(1 for m in self.members.values() if m.borrowed_books)\n    print(f\"活跃会员: {active_members} 人\")\n    print(f\"\\n借阅记录: {len(self.borrow_records)} 条\")\n    active_borrows = sum(1 for r in self.borrow_records if not r.return_date)\n    print(f\"当前借阅: {active_borrows} 本\")\n        overdue = self.get_overdue_books()\n        if overdue:\n            print(f\"\\n逾期图书: {len(overdue)} 本\")\n            for record in overdue[:5]:\n                # 显示前5条\n                print(f\"  - {record}\")\n        print(\"=\"*60 + \"\\n\")\n# 使用示例\nif __name__ == \"__main__\":\n    # 创建图书馆\n    library = Library(\"市图书馆\")\n    # 添加图书\n    library.add_book(Book(\"B001\", \"Python编程\", \"张三\", \"978-1234567890\", 3))\n    library.add_book(Book(\"B002\", \"数据结构\", \"李四\", \"978-0987654321\", 2))\n    library.add_book(Book(\"B003\", \"算法导论\", \"王五\", \"978-1111111111\", 1))\n    # 添加会员\n    library.add_member(Member(\"M001\", \"小明\"))\n    library.add_member(Member(\"M002\", \"小红\"))\n    library.add_member(Member(\"M003\", \"小刚\"))\n    # 借书\n    print(\"\\n\" + \"=\"*60)\n    print(\"借阅操作\")\n    print(\"=\"*60)\n    library.borrow_book(\"M001\", \"B001\")\n    library.borrow_book(\"M001\", \"B002\")\n    library.borrow_book(\"M002\", \"B001\")\n    # 搜索图书\n    print(\"\\n\" + \"=\"*60)\n    print(\"搜索图书\")\n    print(\"=\"*60)\n    results = library.search_books(\"Python\")\n    print(f\"搜索 'Python' 的结果:\")\n    for book in results:\n    print(f\"\n            {book}\")\n# 还书\nprint(\"\\n\" + \"=\"*60)\nprint(\"归还操作\")\nprint(\"=\"*60)\nlibrary.return_book(\"M001\", \"B001\")\n# 生成报告\nlibrary.generate_report()\n设计要点：\n1. 多类协作\n多类协作：Book、Member、BorrowRecord、Library四个类各司其职\n2. 装饰器应用\n装饰器应用：使用@log_operation记录所有操作\n3. 业务逻辑\n业务逻辑：完整的借还书流程，包括逾期检查\n4. 数据管理\n数据管理：使用字典存储，便于快速查找\n5. 扩展性\n扩展性：易于添加新功能（如预约、续借等）\n题目2：日志分析工具（完整实现）\n\"\"\"\n日志分析工具\n功能：解析日志文件、统计分析、生成报告\n使用生成器处理大文件，Pandas进行数据分析\n\"\"\"\nimport re\nfrom pathlib import Path\nfrom datetime import datetime\nfrom collections import Counter, defaultdict\nimport pandas as pd\nclass LogParser:\n    \"\"\"日志解析器\"\"\"\n    # 常见日志格式的正则表达式\n    PATTERNS = {\n        'apache': r'(\\S+) \\S+ \\S+ \\[([\\w:/]+\\s[+\\-]\\d{4})\\] \"(\\S+) (\\S+) (\\S+)\" (\\d{3}) (\\\n        'nginx': r'(\\S+) - - \\[(.*?)\\] \"(\\w+) (.*?) HTTP/.*?\" (\\d+) (\\d+)',\n        'python': r'(\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}),\\d+ - (\\w+) - (.+)',\n        'custom': r'\\[(\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2})\\] (\\w+): (.+)'\n    }\n    def __init__(self, log_format='custom'):\n        self.log_format = log_format\n        self.pattern = re.compile(self.PATTERNS.get(log_format, self.PATTERNS['custom']))\n    def parse_line(self, line):\n        \"\"\"解析单行日志\"\"\"\n        match = self.pattern.match(line.strip())\n        if not match:\n            return None\n        if self.log_format == 'apache':\n            return {\n                'ip': match.group(1),\n                'timestamp': match.group(2),\n                'method': match.group(3),\n                'url': match.group(4),\n                'protocol': match.group(5),\n                'status': int(match.group(6)),\n                'size': int(match.group(7))\n            }\n        elif self.log_format == 'python':\n            return {\n                'timestamp': match.group(1),\n                'level': match.group(2),\n                'message': match.group(3)\n            }\n        elif self.log_format == 'custom':\n            return {\n                'timestamp': match.group(1),\n                'level': match.group(2),\n                'message': match.group(3)\n            }\n        return None\n    def parse_file(self, filepath):\n        \"\"\"\n        生成器：逐行解析日志文件\n        :param filepath: 日志文件路径\n        :yield: 解析后的日志字典\n        \"\"\"\n        try:\n            with open(filepath, 'r', encoding='utf-8') as f:\n                for line_num, line in enumerate(f, 1):\n                parsed = self.parse_line(line)\n                if parsed:\n                parsed['line_num'] = line_num\n                yield parsed\n        except Exception as e:\n            print(f\"解析文件出错: {e}\")\nclass LogAnalyzer:\n    \"\"\"日志分析器\"\"\"\ndef __init__(self, parser):\n    self.parser = parser\n    self.logs = []\ndef load_logs(self, filepath):\n    \"\"\"加载日志\"\"\"\n    print(f\"正在加载日志: {filepath}\")\n    self.logs = list(self.parser.parse_file(filepath))\n    print(f\"成功加载{len(self.logs)} 条日志\")\n    return self.logs\ndef filter_by_level(self, level):\n    \"\"\"按日志级别过滤\"\"\"\n    return [log for log in self.logs if log.get('level') == level]\ndef filter_by_time_range(self, start_time, end_time):\n    \"\"\"按时间范围过滤\"\"\"\n    filtered = []\n    for log in self.logs:\n        try:\n            log_time = datetime.strptime(log['timestamp'], '%Y-%m-%d %H:%M:%S')\n            if start_time <= log_time <= end_time:\n                filtered.append(log)\n        except:\n            continue\n    return filtered\ndef count_by_level(self):\n    \"\"\"统计各级别日志数量\"\"\"\n    levels = [log.get('level', 'UNKNOWN') for log in self.logs]\n    return Counter(levels)\ndef count_by_hour(self):\n    \"\"\"按小时统计日志数量\"\"\"\n    hours = defaultdict(int)\n    for log in self.logs:\n        try:\n            timestamp = log['timestamp']\n            hour = timestamp.split()[1].split(':')[0]\n            hours[hour] += 1\n        except:\n            continue\n    return dict(sorted(hours.items()))\ndef find_errors(self):\n    \"\"\"查找错误日志\"\"\"\n    errors = []\n    for log in self.logs:\n        level = log.get('level', '').upper()\n        if level in ['ERROR', 'CRITICAL', 'FATAL']:\n            errors.append(log)\n    return errors\ndef search_keyword(self, keyword):\n    \"\"\"搜索包含关键词的日志\"\"\"\n    results = []\n    keyword_lower = keyword.lower()\n    for log in self.logs:\n        message = log.get('message', '').lower()\n        if keyword_lower in message:\n            results.append(log)\n    return results\ndef to_dataframe(self):\n    \"\"\"转换为Pandas DataFrame\"\"\"\n    if not self.logs:\n        return pd.DataFrame()\n    return pd.DataFrame(self.logs)\ndef generate_report(self, output_file='log_report.txt'):\n    \"\"\"生成分析报告\"\"\"\n    report = []\n    report.append(\"=\"*70)\n    report.append(\"日志分析报告\".center(70))\n    report.append(\"=\"*70)\n    report.append(f\"\\n总日志条数: {len(self.logs)}\")\n    # 按级别统计\n    level_counts = self.count_by_level()\n    report.append(\"\\n按级别统计:\")\n        for level, count in sorted(level_counts.items()):\n            percentage = (count / len(self.logs)) * 100\n            report.append(f\"\n                {level}: {count} ({percentage:.2f}%)\")\n        # 按小时统计\n        hour_counts = self.count_by_hour()\n        report.append(\"\\n按小时统计:\")\n        for hour, count in hour_counts.items():\n            report.append(f\"\n                {hour}:00 - {count} 条\")\n        # 错误日志\n        errors = self.find_errors()\n        report.append(f\"\\n错误日志: {len(errors)} 条\")\n        if errors:\n            report.append(\"最近5条错误:\")\n            for error in errors[:5]:\n                report.append(f\"  [{error['timestamp']}] {error.get('message', '')[:60]}\")\n        report.append(\"=\"*70)\n        # 输出到文件\n        report_text = '\\n'.join(report)\n        Path(output_file).write_text(report_text, encoding='utf-8')\n        print(f\"\\n报告已保存到: {output_file}\")\n        print(report_text)\n        return report_text\n# 使用示例\nif __name__ == \"__main__\":\n    # 创建测试日志文件\n    test_log = Path(\"test_app.log\")\n    log_content = \"\"\"[2024-01-01 10:15:23] INFO: 应用启动成功\n[2024-01-01 10:15:24] DEBUG: 加载配置文件\n[2024-01-01 10:15:25] INFO: 数据库连接成功\n[2024-01-01 10:20:30] WARNING: 内存使用率达到80%\n[2024-01-01 10:25:45] ERROR: 数据库查询超时\n[2024-01 l}: {count}\")",

    "title": "配置文件管理器",
    "answer": "import json\nfrom pathlib import Path\nfrom functools import wraps\nimport time\nclass ConfigManager:\n    _instance = None\n    def __new__(cls, *args, **kwargs):\n        if cls._instance is None:\n            cls._instance = super().__new__(cls)\n        return cls._instance\n    def __init__(self, config_file=None):\n        if not hasattr(self, '_initialized'):\n            self._config = {}\n            self._config_file = None\n            self._last_modified = None\n            if config_file:\n                self.load_config(config_file)\n            self._initialized = True\n    def load_config(self, config_file):\n        path = Path(config_file)\n        if not path.exists():\n            raise FileNotFoundError(f\"配置文件{config_file} 不存在\")\n        with path.open('r', encoding='utf-8') as f:\n            self._config = json.load(f)\n        self._config_file = path\n        self._last_modified = path.stat().st_mtime\n        print(f\"已加载配置: {config_file}\")\n    def reload_if_modified(self):\n        if self._config_file:\n            current_mtime = self._config_file.stat().st_mtime\n            if current_mtime > self._last_modified:\n                print(\"检测到配置文件变化，重新加载...\")\n                self.load_config(self._config_file)\n    def get(self, key, default=None):\n        self.reload_if_modified()\n        keys = key.split('.')\n        value = self._config\n        for k in keys:\n            if isinstance(value, dict) and k in value:\n                value = value[k]\n            else:\n                return default\n        return value\n    @property\n    def config(self):\n        self.reload_if_modified()\n        return self._config\ndef require_config(key):\n    def decorator(func):\n        @wraps(func)\n        def wrapper(*args, **kwargs):\n            config = ConfigManager()\n            if config.get(key) is None:\n                raise ValueError(f\"缺少配置项: {key}\")\n            return func(*args, **kwargs)\n        return wrapper\n    return decorator\n# 使用示例\nconfig_data = {\n    \"database\": {\n        \"host\": \"localhost\",\n        \"port\": 5432,\n        \"name\": \"mydb\"\n    },\n    \"app\": {\n        \"debug\": True,\n        \"version\": \"1.0\"\n    }\n# 创建配置文件\nconfig_file = Path('config.json')\nconfig_file.write_text(json.dumps(config_data, indent=2))\n# 使用配置管理器\nconfig = ConfigManager('config.json')\nprint(f\"数据库主机: {config.get('database.host')}\")\nprint(f\"应用版本: {config.get('app.version')}\")\n@require_config('database.host')\ndef connect_database():\n    config = ConfigManager()\n    host = config.get('database.host')\n    print(f\"连接到数据库: {host}\")\nconnect_database()",

    "answer": "from pathlib import Path\nimport re\nfrom functools import wraps\nimport time\ndef timer(func):\n    @wraps(func)\n    def wrapper(*args, **kwargs):\n        start = time.time()\n        result = func(*args, **kwargs)\n        end = time.time()\n        print(f\"{func.__name__} 执行时间: {end-start:.4f}秒\")\n        return result\n    return wrapper\n@timer\ndef analyze_file(filepath):\n    path = Path(filepath)\n    if not path.exists():\n        return None\n    with path.open('r', encoding='utf-8') as f:\n        lines = f.readlines()\n    total_lines = len(lines)\n    code_lines = 0\n    comment_lines = 0\n    blank_lines = 0\n    for line in lines:\n        stripped = line.strip()\n        if not stripped:\n            blank_lines += 1\n        elif stripped.startswith('#'):\n            comment_lines += 1\n        else:\n            code_lines += 1\n    # 统计函数和类\n    content = ''.join(lines)\n    functions = len(re.findall(r'^\\s*def\\s+\\w+', content, re.MULTILINE))\n    classes = len(re.findall(r'^\\s*class\\s+\\w+', content, re.MULTILINE))\n    # 简单复杂度（if/for/while数量）\n    complexity = (\n        len(re.findall(r'\\bif\\b', content)) +\n        len(re.findall(r'\\bfor\\b', content)) +\n        len(re.findall(r'\\bwhile\\b', content))\n    )\n    return {\n        'file': filepath,\n        'total_lines': total_lines,\n        'code_lines': code_lines,\n        'comment_lines': comment_lines,\n        'blank_lines': blank_lines,\n        'functions': functions,\n        'classes': classes,\n        'complexity': complexity\n    }\ndef find_long_functions(directory, max_lines=50):\n    path = Path(directory)\n    for py_file in path.rglob('*.py'):\n        with py_file.open('r', encoding='utf-8') as f:\n            content = f.read()\n        # 简单查找函数定义\n        pattern = r'def\\s+(\\w+)\\s*\\([^)]*\\):'\n        matches = re.finditer(pattern, content)\n        for match in matches:\n            func_name = match.group(1)\n            start_pos = match.start()\n            # 估算函数行数（简化版）\n            func_content = content[start_pos:]\n            lines = func_content.split('\\n')\n            func_lines = 0\n            indent_level = None\n            for line in lines[1:]:\n                if line.strip():\n                current_indent = len(line) - len(line.lstrip())\n                if indent_level is None:\n                indent_level = current_indent\n                elif current_indent <= indent_level and line.strip():\n                break\n                func_lines += 1\n            if func_lines > max_lines:\n                yield {\n                'file': str(py_file),\n                'function': func_name,\n                'lines': func_lines\n                }\ndef check_naming_convention(filepath):\n    path = Path(filepath)\n    with path.open('r', encoding='utf-8') as f:\n        content = f.read()\n    issues = []\n    # 检查函数名（应该是snake_case）\n    func_pattern = r'def\\s+([A-Z]\\w+)\\s*\\('\n    for match in re.finditer(func_pattern, content):\n        issues.append(f\"函数名{match.group(1)} 应使用snake_case\")\n    # 检查类名（应该是PascalCase）\n    class_pattern = r'class\\s+([a-z]\\w+)\\s*[:(]'\n    for match in re.finditer(class_pattern, content):\n        issues.append(f\"类名{match.group(1)} 应使用PascalCase\")\n    return issues\ndef generate_html_report(analysis_results, output_file='report.html'):\nhtml = \"\"\"\n<html>\n<head>\n    <title>代码质量报告<\/title>\n    <style>\n        body { font-family: Arial, sans-serif; margin: 20px; }\n        table { border-collapse: collapse; width: 100%; }\n        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }\n        th { background-color: #4CAF50; color: white; }\n        tr:nth-child(even) { background-color: #f2f2f2; }\n    <\/style>\n<\/head>\n<body>\n    <h1>代码质量分析报告<\/h1>\n    <table>\n        <tr>\n            <th>文件<\/th>\n            <th>总行数<\/th>\n            <th>代码行<\/th>\n            <th>注释行<\/th>\n            <th>空行<\/th>\n            <th>函数数<\/th>\n            <th>类数<\/th>\n            <th>复杂度<\/th>\n        <\/tr>\n\"\"\"\nfor result in analysis_results:\n    if result:\n        html += f\"\"\"\n        <tr>\n            <td>{result['file']}<\/td>\n            <td>{result['total_lines']}<\/td>\n            <td>{result['code_lines']}<\/td>\n            <td>{result['comment_lines']}<\/td>\n            <td>{result['blank_lines']}<\/td>\n            <td>{result['functions']}<\/td>\n            <td>{result['classes']}<\/td>\n            <td>{result['complexity']}<\/td>\n        <\/tr>\n        \"\"\"\nhtml += \"\"\"\n    <\/table>\n<\/body>\n<\/html>\n\"\"\"\nPath(output_file).write_text(html, encoding='utf-8')\nprint(f\"HTML报告已生成: {output_file}\")\n# 使用示例\n# results = []\n# for py_file in Path('.').rglob('*.py'):\n#     result = analyze_file(py_file)\n#     if result:\n#         results.append(result)\n#         print(f\"\\n分析 {py_file}:\")\n#         print(f\"  代码行: {result['code_lines']}\")\n#         print(f\"  函数数: {result['functions']}\")\n#         print(f\"  复杂度: {result['complexity']}\")\n# generate_html_report(results)\n# print(\"\\n查找长函数:\")\n# for func_info in find_long_functions('.', max_lines=30):\n#     print(f\"  {func_info['function']} in {func_info['file']}: {func_info['lines']} 行\")",

    "stem": "设计一个任务调度系统，要求：\nTask类：\n    类：\n• 属性：任务名、优先级、状态（待执行/执行中/已完成）\n• 方法： execute() （抽象方法）\n• 实现 __lt__() 用于优先级比较\nScheduler类：\n    类：\n• 使用优先队列管理任务\n• 方法：\n◦ add_task(task) ：添加任务\n◦ run_next() ：执行优先级最高的任务\n◦ run_all() ：执行所有任务\n◦使用生成器 pending_tasks() 返回待执行任务\n装饰器 @retry_on_failure(max_retries) ：\n• 任务失败时自动重试\n• 记录重试次数\n要求：\n• 实现至少2种具体任务类\n• 使用 heapq 模块实现优先队列\n• 添加日志记录",
    "title": "任务调度系统",
    "answer": "import heapq\nfrom abc import ABC, abstractmethod\nfrom enum import Enum\nimport logging\nfrom functools import wraps\nlogging.basicConfig(level=logging.INFO)\nlogger = logging.getLogger(__name__)\nclass TaskStatus(Enum):\n    PENDING = \"待执行\"\n    RUNNING = \"执行中\"\n    COMPLETED = \"已完成\"\n    FAILED = \"失败\"\ndef retry_on_failure(max_retries=3):\n    def decorator(func):\n        @wraps(func)\n        def wrapper(self, *args, **kwargs):\n            retries = 0\n            while retries < max_retries:\n                try:\n                return func(self, *args, **kwargs)\n                except Exception as e:\n                retries += 1\n                logger.warning(f\"任务{self.name} 执行失败 (尝试{retries}/{max_retries}\n                if retries >= max_retries:\n                self.status = TaskStatus.FAILED\n                raise\n            return None\n        return wrapper\n    return decorator\nclass Task(ABC):\n    def __init__(self, name, priority=0):\n        self.name = name\n        self.priority = priority\n        self.status = TaskStatus.PENDING\n    @abstractmethod\n    def execute(self):\n        pass\n    def __lt__(self, other):\n        return self.priority > other.priority\n    def __repr__(self):\n        return f\"Task({self.name}, priority={self.priority}, status={self.status.value})\"\nclass DataProcessTask(Task):\n    def __init__(self, name, data, priority=0):\n        super().__init__(name, priority)\n        self.data = data\n    @retry_on_failure(max_retries=3)\n    def execute(self):\n        logger.info(f\"执行数据处理任务: {self.name}\")\n        self.status = TaskStatus.RUNNING\n        # 模拟数据处理\n        result = sum(self.data)\n        self.status = TaskStatus.COMPLETED\n        logger.info(f\"任务{self.name} 完成，结果: {result}\")\n        return result\nclass EmailTask(Task):\n    def __init__(self, name, recipient, message, priority=0):\n        super().__init__(name, priority)\n        self.recipient = recipient\n        self.message = message\n    @retry_on_failure(max_retries=2)\n    def execute(self):\n        logger.info(f\"执行邮件任务: {self.name}\")\n        self.status = TaskStatus.RUNNING\n        # 模拟发送邮件\n        logger.info(f\"发送邮件到{self.recipient}: {self.message}\")\n        self.status = TaskStatus.COMPLETED\n        return True\nclass Scheduler:\n    def __init__(self):\n        self.task_queue = []\n        self.completed_tasks = []\n    def add_task(self, task):\n        heapq.heappush(self.task_queue, task)\n        logger.info(f\"添加任务: {task.name} (优先级: {task.priority})\")\n    def run_next(self):\n        if not self.task_queue:\n            logger.info(\"没有待执行的任务\")\n            return None\n        task = heapq.heappop(self.task_queue)\n        try:\n            result = task.execute()\n            self.completed_tasks.append(task)\n            return result\n        except Exception as e:\n            logger.error(f\"任务执行失败: {task.name}, 错误: {e}\")\n            return None\n    def run_all(self):\n        logger.info(f\"开始执行所有任务，共{len(self.task_queue)} 个\")\n        while self.task_queue:\n            self.run_next()\n        logger.info(\"所有任务执行完成\")\n    def pending_tasks(self):\n        for task in self.task_queue:\n            if task.status == TaskStatus.PENDING:\n                yield task\n    def __len__(self):\n        return len(self.task_queue)\n# 使用示例\nscheduler = Scheduler()\n# 添加任务\nscheduler.add_task(DataProcessTask(\"处理数据1\", [1, 2, 3, 4, 5], priority=1))\nscheduler.add_task(EmailTask(\"发送报告\", \"user@example.com\", \"报告内容\", priority=3))\nscheduler.add_task(DataProcessTask(\"处理数据2\", [10, 20, 30], priority=2))\nprint(\"\\n待执行任务:\")\nfor task in scheduler.pending_tasks():\n    print(f\"\n            {task}\")\nprint(f\"\\n开始调度{len(scheduler)} 个任务\\n\")\nscheduler.run_all()\nprint(f\"\\n已完成{len(scheduler.completed_tasks)} 个任务\")",

    "stem": "实现一个多级缓存系统：\n1. LRUCache类：\n        类：\n• 实现LRU（最近最少使用）缓存\n• 使用 OrderedDict\n• 方法： get(key) 、 put(key, value)\n• 实现 __getitem__ 和 __setitem__\n2. CacheDecorator：\n• 函数结果缓存装饰器\n• 支持TTL（过期时间）\n• 支持缓存统计（命中率）\n3. MultiLevelCache：\n• 组合多个缓存层\n• L1缓存（内存）、L2缓存（文件）\n• 自动降级和升级\n要求：\n• 使用 pathlib 处理文件缓存\n• 使用 pickle 序列化数据\n• 实现缓存预热和清理",
    "title": "缓存系统",
    "answer": "from collections import OrderedDict\nfrom pathlib import Path\nimport pickle\nimport time\nfrom functools import wraps\nclass LRUCache:\n    def __init__(self, capacity):\n        self.capacity = capacity\n        self.cache = OrderedDict()\n    def get(self, key):\n        if key not in self.cache:\n            return None\n        self.cache.move_to_end(key)\n        return self.cache[key]\n    def put(self, key, value):\n        if key in self.cache:\n            self.cache.move_to_end(key)\n        self.cache[key] = value\n        if len(self.cache) > self.capacity:\n            self.cache.popitem(last=False)\n    def __getitem__(self, key):\n        return self.get(key)\n    def __setitem__(self, key, value):\n        self.put(key, value)\n    def __len__(self):\n        return len(self.cache)\n    def __repr__(self):\n        return f\"LRUCache(capacity={self.capacity}, size={len(self.cache)})\"\nclass CacheDecorator:\n    def __init__(self, ttl=None):\n        self.ttl = ttl\n        self.cache = {}\n        self.timestamps = {}\n        self.hits = 0\n        self.misses = 0\n    def __call__(self, func):\n        @wraps(func)\n        def wrapper(*args, **kwargs):\n            key = str(args) + str(kwargs)\n            current_time = time.time()\n            # 检查缓存\n            if key in self.cache:\n                if self.ttl is None or (current_time - self.timestamps[key]) < self.ttl:\n                self.hits += 1\n                return self.cache[key]\n            # 缓存未命中\n            self.misses += 1\n            result = func(*args, **kwargs)\n            self.cache[key] = result\n            self.timestamps[key] = current_time\n            return result\n        wrapper.cache_info = lambda: {\n            'hits': self.hits,\n            'misses': self.misses,\n            'hit_rate': self.hits / (self.hits + self.misses) if (self.hits + self.misses)\n        }\n        wrapper.cache_clear = lambda: self.cache.clear()\n        return wrapper\nclass MultiLevelCache:\n    def __init__(self, l1_capacity=100, cache_dir='cache'):\n        self.l1_cache = LRUCache(l1_capacity)\n        self.cache_dir = Path(cache_dir)\n        self.cache_dir.mkdir(exist_ok=True)\n    def get(self, key):\n        # 先查L1缓存\n        value = self.l1_cache.get(key)\n        if value is not None:\n            print(f\"L1缓存命中: {key}\")\n            return value\n        # 查L2缓存（文件）\n        cache_file = self.cache_dir / f\"{key}.pkl\"\n        if cache_file.exists():\n            print(f\"L2缓存命中: {key}\")\n            with cache_file.open('rb') as f:\n                value = pickle.load(f)\n            # 升级到L1\n            self.l1_cache.put(key, value)\n            return value\n        print(f\"缓存未命中: {key}\")\n        return None\n    def put(self, key, value):\n        # 存入L1\n        self.l1_cache.put(key, value)\n        # 存入L2\n        cache_file = self.cache_dir / f\"{key}.pkl\"\n        with cache_file.open('wb') as f:\n            pickle.dump(value, f)\n    def clear(self):\n        self.l1_cache.cache.clear()\n        for file in self.cache_dir.glob('*.pkl'):\n            file.unlink()\n# 使用示例\nprint(\"=== LRU缓存示例 ===\")\nlru = LRUCache(3)\nlru['a'] = 1\nlru['b'] = 2\nlru['c'] = 3\nprint(f\"缓存: {dict(lru.cache)}\")\nlru['d'] = 4\n            # 'a'被淘汰\nprint(f\"添加'd'后: {dict(lru.cache)}\")\nprint(\"\\n=== 缓存装饰器示例 ===\")\n@CacheDecorator(ttl=5)\ndef expensive_function(n):\n    print(f\"计算{n}...\")\n    time.sleep(0.1)\n    return n ** 2\nprint(expensive_function(5))\n# 从缓存获取\nprint(f\"缓存统计: {expensive_function.cache_info()}\")\nprint(\"\\n=== 多级缓存示例 ===\")\nml_cache = MultiLevelCache(l1_capacity=2)\nml_cache.put('key1', 'value1')\nml_cache.put('key2', 'value2')\nml_cache.put('key3', 'value3')\nprint(ml_cache.get('key1'))\n# L2命中，升级到L1\nprint(ml_cache.get('key1'))\n# L1命中",
    "explanation": ""

    "stem": "使用Pandas创建自动化数据分析报告：\n给定销售数据（日期、区域、产品、销量、金额）：\n1. 数据清洗：\n• 处理缺失值和异常值\n• 数据类型转换\n• 去重\n2. 统计分析：\n• 描述性统计\n• 按维度聚合（区域、产品、时间）\n• 同比环比分析\n• 趋势分析（移动平均、增长率）\n3. 数据可视化：\n• 销售趋势图\n• 产品占比饼图\n• 区域对比柱状图\n4. 报告生成：\n• 导出Excel（多个sheet）\n• 生成HTML报告\n• 添加图表和表格\n要求：\n• 使用Pandas的高级功能\n• 使用matplotlib/seaborn绘图\n• 代码模块化",
    "title": "数据分析报告生成器",
    "answer": "import pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom datetime import datetime, timedelta\nclass SalesReportGenerator:\n    def __init__(self, data):\n        self.df = data.copy()\n        self.cleaned_df = None\n        self.analysis_results = {}\n    def clean_data(self):\n        print(\"开始数据清洗...\")\n        # 处理缺失值\n        self.df.dropna(subset=['日期', '产品'], inplace=True)\n        self.df['销量'].fillna(self.df['销量'].median(), inplace=True)\n        self.df['金额'].fillna(self.df['金额'].median(), inplace=True)\n        # 数据类型转换\n        self.df['日期'] = pd.to_datetime(self.df['日期'])\n        self.df['销量'] = self.df['销量'].astype(int)\n        self.df['金额'] = self.df['金额'].astype(float)\n        # 去重\n        self.df.drop_duplicates(inplace=True)\n        # 处理异常值（使用IQR方法）\n        Q1 = self.df['金额'].quantile(0.25)\n        Q3 = self.df['金额'].quantile(0.75)\n        IQR = Q3 - Q1\n        self.df = self.df[\n            (self.df['金额'] >= Q1 - 1.5 * IQR) &\n            (self.df['金额'] <= Q3 + 1.5 * IQR)\n        ]\n        self.cleaned_df = self.df.copy()\n        print(f\"清洗完成，剩余{len(self.cleaned_df)} 条记录\")\ndef descriptive_statistics(self):\n    print(\"\\n描述性统计...\")\n    stats = self.cleaned_df[['销量', '金额']].describe()\n    self.analysis_results['descriptive'] = stats\n    return stats\ndef aggregate_analysis(self):\n    print(\"\\n聚合分析...\")\n    # 按区域聚合\n    region_agg = self.cleaned_df.groupby('区域').agg({\n        '销量': 'sum',\n        '金额': 'sum'\n    }).sort_values('金额', ascending=False)\n    # 按产品聚合\n    product_agg = self.cleaned_df.groupby('产品').agg({\n        '销量': 'sum',\n        '金额': 'sum'\n    }).sort_values('金额', ascending=False)\n    # 按时间聚合\n    self.cleaned_df.set_index('日期', inplace=True)\n    time_agg = self.cleaned_df.resample('W').agg({\n        '销量': 'sum',\n        '金额': 'sum'\n    })\n    self.analysis_results['region'] = region_agg\n    self.analysis_results['product'] = product_agg\n    self.analysis_results['time'] = time_agg\n    return region_agg, product_agg, time_agg\ndef trend_analysis(self):\n    print(\"\\n趋势分析...\")\n    # 移动平均\n    self.cleaned_df['MA_7'] = self.cleaned_df['金额'].rolling(window=7).mean()\n    # 增长率\n    self.cleaned_df['增长率'] = self.cleaned_df['金额'].pct_change() * 100\n    self.analysis_results['trend'] = self.cleaned_df[['金额', 'MA_7', '增长率']]\n    return self.cleaned_df[['金额', 'MA_7', '增长率']]\ndef create_visualizations(self):\n    print(\"\\n创建可视化...\")\n    fig, axes = plt.subplots(2, 2, figsize=(15, 10))\n    # 销售趋势图\n    self.analysis_results['time'].plot(y='金额', ax=axes[0, 0], title='销售趋势')\n    axes[0, 0].set_ylabel('金额')\n    # 产品占比饼图\n    product_sales = self.analysis_results['product']['金额']\n    axes[0, 1].pie(product_sales, labels=product_sales.index, autopct='%1.1f%%')\n    axes[0, 1].set_title('产品销售占比')\n    # 区域对比柱状图\n    self.analysis_results['region']['金额'].plot(kind='bar', ax=axes[1, 0], title='区域\n    axes[1, 0].set_ylabel('金额')\n    axes[1, 0].tick_params(axis='x', rotation=45)\n    # 移动平均图\n    self.cleaned_df[['金额', 'MA_7']].plot(ax=axes[1, 1], title='销售额与移动平均')\n    plt.tight_layout()\n    plt.savefig('sales_analysis.png')\n    print(\"图表已保存: sales_analysis.png\")\ndef generate_report(self, filename='sales_report.xlsx'):\n    print(f\"\\n生成报告: {filename}\")\n    with pd.ExcelWriter(filename, engine='openpyxl') as writer:\n        # 原始数据\n        self.cleaned_df.to_excel(writer, sheet_name='清洗后数据')\n        # 描述性统计\n            self.analysis_results['descriptive'].to_excel(writer, sheet_name='描述性统计')\n            # 区域分析\n            self.analysis_results['region'].to_excel(writer, sheet_name='区域分析')\n            # 产品分析\n            self.analysis_results['product'].to_excel(writer, sheet_name='产品分析')\n            # 时间序列\n            self.analysis_results['time'].to_excel(writer, sheet_name='时间序列')\n        print(f\"报告已生成: {filename}\")\n# 使用示例\nnp.random.seed(42)\ndates = pd.date_range('2024-01-01', periods=90, freq='D')\nregions = ['华东', '华南', '华北', '西南']\nproducts = ['产品A', '产品B', '产品C', '产品D']\ndata = {\n    '日期': np.random.choice(dates, 500),\n    '区域': np.random.choice(regions, 500),\n    '产品': np.random.choice(products, 500),\n    '销量': np.random.randint(10, 200, 500),\n    '金额': np.random.uniform(1000, 10000, 500)\n}\ndf = pd.DataFrame(data)\n# 生成报告\ngenerator = SalesReportGenerator(df)\ngenerator.clean_data()\ngenerator.descriptive_statistics()\ngenerator.aggregate_analysis()\ngenerator.trend_analysis()\ngenerator.create_visualizations()\ngenerator.generate_report()\nprint(\"\\n分析完成！\")\n题目4和题目\n和题目5的参考答案由于篇幅限制，这里提供核心实现思路：",
